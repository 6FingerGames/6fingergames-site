<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  
  <filter id="wisp" x="-8%" y="-30%" width="116%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.028 0.05" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div id="stage">
  <canvas id="c"></canvas>

  <section id="menu" class="screen">
    <div class="head">
      <h1 class="logo"><img src="img/logo.webp" alt="Defend the Core" width="989" height="516"></h1>
      <p class="tagline">Guard the little light from the shadows</p>
    </div>
    <div class="menu-buttons">
      <button class="btn primary" id="btnPlay">PLAY</button>
      <button class="btn" id="btnShop">UPGRADES</button>
      <button class="btn small snd-toggle" id="btnSoundMenu"></button>
      <button class="btn small" id="btnAbout">ABOUT</button>
      <div class="stat-line"><i class="orb"></i><b id="menuCoins">0</b> &nbsp; BEST <b id="menuBest">0</b></div>
    </div>
  </section>

  <section id="shop" class="screen dim hidden">
    <h2 class="title">UPGRADES</h2>
    <div class="stat-line big"><i class="orb"></i><b id="shopCoins">0</b></div>
    <div class="shop-list" id="shopList"></div>
    <button class="btn small" id="btnShopBack">BACK</button>
  </section>

  <section id="result" class="screen dim hidden">
    <h2 class="title" id="resTitle">THE LIGHT FADES</h2>
    <div class="result">
      <div class="lbl">REACHED WAVE</div>
      <div class="big" id="resWave">1</div>
      <div class="newbest hidden" id="resNew">NEW RECORD!</div>
      <div class="lbl">SCORE <b id="resScore">0</b> &nbsp; BEST <b id="resBest">0</b></div>
      <div class="earn"><i class="orb"></i> <b id="resCoins">+0</b></div>
      <div class="lbl sub" id="resBreak"></div>
    </div>
    <div class="menu-buttons">
      <button class="btn primary" id="btnResShop">UPGRADES</button>
      <button class="btn green hidden" id="btnDouble">DOUBLE &middot; WATCH AD</button>
      <button class="btn" id="btnAgain">PLAY AGAIN</button>
      <button class="btn small" id="btnResMenu">MENU</button>
    </div>
  </section>

  <section id="revive" class="screen dim hidden">
    <h2 class="title">THE LIGHT IS FADING</h2>
    <p class="msg">Watch a short ad to restore the little light and push the shadows back.</p>
    <div class="menu-buttons">
      <button class="btn green" id="btnRevive">RESTORE &middot; WATCH AD</button>
      <button class="btn small" id="btnNoRevive">NO THANKS</button>
    </div>
  </section>

  <div id="aboutBack" class="backdrop hidden"></div>
  <div id="about" class="panel hidden">
    <h2>ABOUT</h2>
    <p><b>DEFEND THE CORE</b> &middot; v0.1</p>
    <p id="aboutAuthor"></p>
    <p id="aboutStudio"></p>
    <p id="aboutEmail"></p>
    <p id="aboutSite"></p>
    <button class="btn small" id="btnAboutClose">CLOSE</button>
  </div>

  <section id="pause" class="screen dim hidden">
    <h2 class="title">PAUSED</h2>
    <button class="btn primary" id="btnResume">RESUME</button>
  </section>
</div>
