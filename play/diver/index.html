    ctx.fillText("6 Finger Games", cx, compact ? 34 : 48);

    const titleY = compact ? H * 0.15 : H * 0.20;
    wavyText(mtav(T("title")), cx, titleY, compact ? 30 : 42, "#f7fbff");
    const ruleW = Math.min(200, W * 0.46);
    const rg = ctx.createLinearGradient(cx - ruleW / 2, 0, cx + ruleW / 2, 0);
    rg.addColorStop(0, "rgba(255,209,102,0)");
    rg.addColorStop(0.5, "rgba(255,209,102,.95)");
    rg.addColorStop(1, "rgba(255,209,102,0)");
    ctx.strokeStyle = rg;
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.moveTo(cx - ruleW / 2, titleY + 18);
    ctx.lineTo(cx + ruleW / 2, titleY + 18);
    ctx.stroke();

    ctx.font = font(compact ? 13 : 15, "normal");
    ctx.fillStyle = "rgba(226,242,255,.84)";
    ctx.fillText(T("sub1"), cx, titleY + 44);
    ctx.fillText(T("sub2"), cx, titleY + 66);

    const bw = Math.min(300, W - 64);
    const bh = compact ? 46 : 52;
    const gap = 10;
    let by = titleY + (compact ? 88 : 104);
    const langY = H - 46;
    const stack = bh * 3 + gap * 2;
    if (by + stack > langY - 36) by = Math.max(titleY + 76, langY - 36 - stack);
    const bx = cx - bw / 2;
    anyHot = drawBtn("play", T("play"), bx, by, bw, bh, true) || anyHot;
    anyHot = drawBtn("how", T("howBtn"), bx, by + bh + gap, bw, bh, false) || anyHot;
    anyHot = drawBtn("about", T("aboutBtn"), bx, by + (bh + gap) * 2, bw, bh, false) || anyHot;

    const best = loadBest();
    if (best.score > 0) {
      ctx.font = font(13);
      ctx.fillStyle = "#ffd166";
      ctx.textAlign = "center";
      ctx.fillText(fmt(T("best"), best.score, best.depth), cx, by + stack + 28);
    }
    drawLangs(langY);
    if (menuHits.some((r) => overRect(r.x, r.y, r.w, r.h))) anyHot = true;
    canvas.style.cursor = anyHot ? "pointer" : "default";
  }

  function drawOver() {
    menuHits = [];
    menuVignette();
    const w = Math.min(400, W - 40);
    const h = Math.min(360, H - 80);
    const x = (W - w) / 2;
    const y = Math.max(24, (H - h) / 2 - 10);
    drawCard(x, y, w, h);
    const cx = W / 2;
    ctx.textAlign = "center";
    wavyText(mtav(T("overTitle")), cx, y + 64, 30, "#ff6b6b");
    ctx.fillStyle = "#eaf6ff";
    ctx.font = font(22);
    ctx.fillText(fmt(T("total"), banked + score), cx, y + 112);
    ctx.font = font(15, "normal");
    ctx.fillStyle = "rgba(220,240,255,.82)";
    ctx.fillText(fmt(T("maxdepth"), Math.round(maxDepth), Math.round(maxDepth)), cx, y + 142);
    const b = loadBest();
    ctx.fillStyle = "#ffd166";
    ctx.font = font(14);
    ctx.fillText(fmt(T("bestShort"), b.score), cx, y + 170);
    const bw = Math.min(260, w - 48);
    const hot = drawBtn("retry", T("tapAgain"), cx - bw / 2, y + h - 72, bw, 48, true);
    canvas.style.cursor = hot ? "pointer" : "default";
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  bestRun = loadBest().score;
  bestDepth = loadBest().depth;
  setLang(lang);
  layoutLangs();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 34px "Noto Serif Georgian"', "ჩქარი");
    document.fonts.load('bold 16px "Noto Sans Georgian"', "ჩქარი");
    document.fonts.load('15px "Noto Sans Georgian"', "ჩქარი");
  }
  reset();
  state = STATE.MENU;

  // minimal debug/automation hook (read-only getters + hold control)
  window.__ob = {
    get state() { return state === STATE.MENU ? "menu" : state === STATE.PLAY ? "play" : state === STATE.DYING ? "dying" : "over"; },
    get oxygen() { return oxygen; },
    get depth() { return depthAt(player.y); },
    get x() { return player.x; },
    get langRects() { return langRects; },
    get lang() { return lang; },
    get audio() { return AC ? AC.state : "none"; },
    get shake() { return shake; },
    get duckX() { return duckX; },
    get flash() { return Math.max(flashRed, flashYellow, flashGreen); },
    get score() { return score; },
    get banked() { return banked; },
    start() { if (state !== STATE.PLAY) { reset(); state = STATE.PLAY; } },
    menu() { state = STATE.MENU; holding = false; },
    setHold(v) { holding = !!v; },
    pause(v) { paused = !!v; },
    step(ms) { const dt = Math.min(0.05, ms / 1000); update(dt); render(); },
    kinds() { const c = {}; for (const e of entities) c[e.kind] = (c[e.kind] || 0) + 1; return c; },
    get entities() { return entities; },
    get player() { return player; },
    setPlayer(x, y) { player.x = x; player.y = y; player.vy = 0; player.vx = 0; }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
