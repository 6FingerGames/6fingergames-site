      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, hot ? "#ffe7a8" : "#ffd166");
      g.addColorStop(1, hot ? "#f0b44a" : "#d9922e");
      ctx.fillStyle = g;
      roundBox(x, y, w, h, 14);
      ctx.fill();
      ctx.fillStyle = "#1b1408";
      ctx.font = font(18);
    } else {
      ctx.fillStyle = hot ? "rgba(255,255,255,.14)" : "rgba(8,22,36,.55)";
      roundBox(x, y, w, h, 14);
      ctx.fill();
      ctx.strokeStyle = hot ? "rgba(255,209,102,.95)" : "rgba(234,246,255,.28)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#eaf6ff";
      ctx.font = font(15);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.restore();
    return hot;
  }
  function drawLinkBtn(id, title, sub, x, y, w, h) {
    const hot = overRect(x, y, w, h);
    menuHits.push({ id, x, y, w, h });
    ctx.save();
    ctx.fillStyle = hot ? "rgba(255,209,102,.16)" : "rgba(8,22,36,.55)";
    roundBox(x, y, w, h, 14);
    ctx.fill();
    ctx.strokeStyle = hot ? "rgba(255,209,102,.95)" : "rgba(234,246,255,.28)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#f4fbff";
    ctx.font = font(15);
    ctx.fillText(title, x + w / 2, y + h * 0.38);
    ctx.fillStyle = "#ffd166";
    ctx.font = font(12, "normal");
    ctx.fillText(sub, x + w / 2, y + h * 0.72);
    ctx.restore();
    return hot;
  }
  function drawLangs(y) {
    const bw = Math.min(84, (W - 48) / LANGS.length - 6);
    const bh = 28, gap = 8;
    const total = LANGS.length * bw + (LANGS.length - 1) * gap;
    let x = W / 2 - total / 2;
    langRects = [];
    ctx.font = font(12);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const code of LANGS) {
      const active = code === lang;
      const hot = overRect(x, y, bw, bh);
      menuHits.push({ id: "lang:" + code, x, y, w: bw, h: bh });
      langRects.push({ x, y, w: bw, h: bh, code });
      ctx.fillStyle = active ? "rgba(255,209,102,.95)" : (hot ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.08)");
      roundBox(x, y, bw, bh, 8);
      ctx.fill();
      if (!active) {
        ctx.strokeStyle = "rgba(255,255,255,.18)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.fillStyle = active ? "#1b1408" : "rgba(255,255,255,.88)";
      ctx.fillText(I18N[code].name, x + bw / 2, y + bh / 2 + 1);
      x += bw + gap;
    }
    ctx.textBaseline = "alphabetic";
  }
  function menuVignette() {
    ctx.fillStyle = "rgba(3,12,22,.34)";
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * 0.38, H * 0.12, W / 2, H * 0.42, H * 0.78);
    vg.addColorStop(0, "rgba(3,12,22,0)");
    vg.addColorStop(1, "rgba(2,8,16,.62)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  function drawMenuSheet(title) {
    const w = Math.min(440, W - 36);
    const h = Math.min(menuView === "about" ? 540 : 460, H - 36);
    const x = (W - w) / 2;
    const y = Math.max(28, (H - h) / 2 - 8);
    drawCard(x, y, w, h);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd166";
    ctx.font = font(13);
    ctx.fillText("6 Finger Games", W / 2, y + 28);
    wavyText(mtav(title), W / 2, y + 62, Math.min(28, w / 12), "#f4fbff");
    return { x, y, w, h };
  }

  function drawMenu() {
    menuHits = [];
    menuVignette();
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const cx = W / 2;
    const compact = H < 700;
    let anyHot = false;

    if (menuView === "how" || menuView === "about" || menuView === "soon") {
      const sheetTitle = menuView === "how" ? T("howTitle")
        : menuView === "about" ? T("aboutTitle")
        : T(soonKind === "web" ? "website" : soonKind === "support" ? "support" : "otherGames");
      const sheet = drawMenuSheet(sheetTitle);
      ctx.font = font(compact ? 13 : 15, "normal");
      ctx.fillStyle = "rgba(234,246,255,.88)";
      let anyHot = false;
      if (menuView === "how") {
        let ly = sheet.y + 100;
        const gap = compact ? 28 : 34;
        for (const line of T("lines")) {
          ctx.fillText(line, cx, ly);
          ly += gap;
        }
      } else if (menuView === "soon") {
        ctx.font = font(20);
        ctx.fillStyle = "#ffd166";
        ctx.fillText(T("comingSoon"), cx, sheet.y + sheet.h * 0.48);
      } else {
        ctx.font = font(compact ? 13 : 15);
        ctx.fillStyle = "#eaf6ff";
        ctx.fillText(T("authorLine"), cx, sheet.y + 108);
        ctx.fillText(T("designerLine"), cx, sheet.y + 134);
        const bw = Math.min(300, sheet.w - 40);
        const bh = compact ? 50 : 56;
        const gap = 10;
        let by = sheet.y + 162;
        STUDIO_ORDER.forEach((id, i) => {
          const L = STUDIO_LINKS[id];
          anyHot = drawLinkBtn(id, L.title ? T(L.title) : L.name, L.sub, cx - bw / 2, by + (bh + gap) * i, bw, bh) || anyHot;
        });
      }
      const bw = Math.min(220, sheet.w - 48);
      anyHot = drawBtn("back", T("back"), cx - bw / 2, sheet.y + sheet.h - 64, bw, 44, false) || anyHot;
      canvas.style.cursor = anyHot ? "pointer" : "default";
      return;
    }

    ctx.font = font(12);
    ctx.fillStyle = "rgba(255,209,102,.9)";
    ctx.fillText("6 Finger Games", cx, compact ? 34 : 48);

    const titleY = compact ? H * 0.15 : H * 0.20;
    wavyText(mtav(T("title")), cx, titleY, compact ? 30 : 42, "#f7fbff");
    const ruleW = Math.min(200, W * 0.46);
    const rg = ctx.createLinearGradient(cx - ruleW / 2, 0, cx + ruleW / 2, 0);
    rg.addColorStop(0, "rgba(255,209,102,0)");
    rg.addColorStop(0.5, "rgba(255,209,102,.95)");
    rg.addColorStop(1, "rgba(255,209,102,0)");
    ctx.strokeStyle = rg;
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.moveTo(cx - ruleW / 2, titleY + 18);
    ctx.lineTo(cx + ruleW / 2, titleY + 18);
    ctx.stroke();

    ctx.font = font(compact ? 13 : 15, "normal");
    ctx.fillStyle = "rgba(226,242,255,.84)";
    ctx.fillText(T("sub1"), cx, titleY + 44);
    ctx.fillText(T("sub2"), cx, titleY + 66);

    const bw = Math.min(300, W - 64);
    const bh = compact ? 46 : 52;
    const gap = 10;
    let by = titleY + (compact ? 88 : 104);
    const langY = H - 46;
    const stack = bh * 3 + gap * 2;
    if (by + stack > langY - 36) by = Math.max(titleY + 76, langY - 36 - stack);
    const bx = cx - bw / 2;
    anyHot = drawBtn("play", T("play"), bx, by, bw, bh, true) || anyHot;
    anyHot = drawBtn("how", T("howBtn"), bx, by + bh + gap, bw, bh, false) || anyHot;
    anyHot = drawBtn("about", T("aboutBtn"), bx, by + (bh + gap) * 2, bw, bh, false) || anyHot;

    const best = loadBest();
    if (best.score > 0) {
      ctx.font = font(13);
      ctx.fillStyle = "#ffd166";
      ctx.textAlign = "center";
      ctx.fillText(fmt(T("best"), best.score, best.depth), cx, by + stack + 28);
    }
    drawLangs(langY);
    if (menuHits.some((r) => overRect(r.x, r.y, r.w, r.h))) anyHot = true;
    canvas.style.cursor = anyHot ? "pointer" : "default";
  }

  function drawOver() {
    menuHits = [];
    menuVignette();
    const w = Math.min(400, W - 40);
    const h = Math.min(360, H - 80);
    const x = (W - w) / 2;
    const y = Math.max(24, (H - h) / 2 - 10);
    drawCard(x, y, w, h);
    const cx = W / 2;
    ctx.textAlign = "center";
    wavyText(mtav(T("overTitle")), cx, y + 64, 30, "#ff6b6b");
    ctx.fillStyle = "#eaf6ff";
    ctx.font = font(22);
    ctx.fillText(fmt(T("total"), banked + score), cx, y + 112);
    ctx.font = font(15, "normal");
    ctx.fillStyle = "rgba(220,240,255,.82)";
    ctx.fillText(fmt(T("maxdepth"), Math.round(maxDepth), Math.round(maxDepth)), cx, y + 142);
    const b = loadBest();
    ctx.fillStyle = "#ffd166";
    ctx.font = font(14);
    ctx.fillText(fmt(T("bestShort"), b.score), cx, y + 170);
    const bw = Math.min(260, w - 48);
    // continue (for a rewarded ad) on top, restart below
    // while no rewarded ad is ready the button waits, dimmed
    const ready = continueReady() && !adBusy;
    if (!ready) ctx.globalAlpha = 0.45;
    const hotC = drawBtn("continue", ready ? "▶  " + T("cont") : "…", cx - bw / 2, y + h - 136, bw, 48, true) && ready;
    ctx.globalAlpha = 1;
    ctx.font = font(12, "normal");
    ctx.fillStyle = "rgba(220,240,255,.7)";
    ctx.textAlign = "center";
    ctx.fillText(T("contSub"), cx, y + h - 72);
    const hotR = drawBtn("restart", T("restart"), cx - bw / 2, y + h - 60, bw, 44, false);
    canvas.style.cursor = hotC || hotR ? "pointer" : "default";
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  bestRun = loadBest().score;
  bestDepth = loadBest().depth;
  setLang(lang);
  layoutLangs();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 34px "Noto Serif Georgian"', "ჩქარი");
    document.fonts.load('bold 16px "Noto Sans Georgian"', "ჩქარი");
    document.fonts.load('15px "Noto Sans Georgian"', "ჩქარი");
  }
  reset();
  state = STATE.MENU;

  // minimal debug/automation hook (read-only getters + hold control)
  window.__ob = {
    get state() { return state === STATE.MENU ? "menu" : state === STATE.PLAY ? "play" : state === STATE.DYING ? "dying" : "over"; },
    get oxygen() { return oxygen; },
    get depth() { return depthAt(player.y); },
    get x() { return player.x; },
    get langRects() { return langRects; },
    get lang() { return lang; },
    get audio() { return AC ? AC.state : "none"; },
    get shake() { return shake; },
    get duckX() { return duckX; },
    get flash() { return Math.max(flashRed, flashYellow, flashGreen); },
    get score() { return score; },
    get banked() { return banked; },
    start() { if (state !== STATE.PLAY) { reset(); state = STATE.PLAY; } },
    menu() { state = STATE.MENU; holding = false; },
    setHold(v) { holding = !!v; },
    pause(v) { paused = !!v; },
    step(ms) { const dt = Math.min(0.05, ms / 1000); update(dt); render(); },
    kinds() { const c = {}; for (const e of entities) c[e.kind] = (c[e.kind] || 0) + 1; return c; },
    get entities() { return entities; },
    get player() { return player; },
    setPlayer(x, y) { player.x = x; player.y = y; player.vy = 0; player.vx = 0; }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
