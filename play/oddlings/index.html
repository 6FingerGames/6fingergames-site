<style id="calmcss">
:root{--bg:#0c0e18;--surf:#ffffff0a;--surf2:#ffffff14;--line:#ffffff1c;--txt:#eceff8;--mut:#8d95ad;--gold:#e8b85a;--teal:#4fd1b0;--ok:#4fd1b0;--ink:#0c0e18;--red:#e5646e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation;background:#0a0c16;overscroll-behavior:none;font-family:'Outfit','Fredoka',system-ui,sans-serif;font-weight:500;color:var(--txt)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.mi{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.mi svg,.ni svg{width:100%;height:100%;display:block}

#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px 0;overflow:hidden;
 background:radial-gradient(130% 55% at 50% -12%,#2b3160 0,#0000 62%),linear-gradient(#0e1120,#0a0c16)}

/* HUD */
#top{display:flex;align-items:center;gap:10px;padding:14px 2px 6px}
.pill{flex:1;display:flex;align-items:center;gap:10px}
.pill .ni{width:30px;height:30px;flex:none}
.pill b{display:inline-block;transform-origin:left center;font-size:30px;line-height:1;font-weight:700;letter-spacing:-.5px;color:var(--txt)}
.round{width:40px;height:40px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);color:var(--mut);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}
.round:active{background:var(--surf)}
#chips{display:flex;gap:8px;align-items:center;min-height:30px;padding:0 0 10px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 11px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-size:13px;white-space:nowrap}
.chip .mi{width:15px;height:15px;vertical-align:0}
.chip b{font-weight:600}
.chip.boost{border-color:#e8b85a77;background:#e8b85a1c;color:var(--gold)}
.chip.boost .mi{color:var(--gold)}
#hint{flex:1;text-align:right;font-size:12px;line-height:1.15;color:var(--mut)}

/* habitat */
#board{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:22px;
 background:radial-gradient(100% 60% at 50% 0,#ffffff0f,#0000),#ffffff06}
#goal{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:var(--surf);border:1px solid var(--line);cursor:pointer}
#goal .gt{flex:1;min-width:0}
#goal .gl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:6px}
#goal .gl b{color:var(--txt);font-weight:600}
#goal .gl em{font-style:normal;color:var(--teal);font-weight:600}
#goal .gb{height:5px;border-radius:3px;background:#ffffff16;overflow:hidden}
#goal .gb i{display:block;height:100%;background:linear-gradient(90deg,#c99534,#f3cd78);border-radius:3px}
#goal .ni{width:22px;height:22px;color:var(--mut);flex:none}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:0 auto}
.cell{position:relative;aspect-ratio:1;border-radius:16px;touch-action:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#ffffff10,#ffffff06);border:1px solid #ffffff12}
.cell::before{content:'';position:absolute;left:22%;right:22%;bottom:13%;height:8%;border-radius:50%;background:#0000004d;filter:blur(1px)}
.cell.empty{background:#00000030;border:1px dashed #ffffff14}
.cell.empty::before{display:none}
.cell.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cell.target{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:#4fd1b022}
.cell.src{opacity:.3}
.cell.locked{flex-direction:column;gap:2px;background:#ffffff05;color:var(--mut);cursor:pointer}
.cell.locked::before{display:none}
.cell.locked svg{width:26%;height:26%;color:#ffffff55}
.cell.locked b{font-size:12.5px;color:var(--gold);font-weight:600;opacity:.85}
.cell.next{border-color:#e8b85a66;animation:breathe 2.4s ease-in-out infinite}
.cr{width:88%;height:88%;pointer-events:none;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.cr svg,.cr img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 3px 3px #0006)}
.cr svg{overflow:visible}
.lv{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:1px;color:var(--gold);pointer-events:none;line-height:1}
.cell.l2{border-color:#6fb7ff88}
.cell.l3{border-color:#b58cffaa}
.cell.l4{border-color:#ffb85acc;box-shadow:inset 0 0 14px #ffb85a22}
.cell.l5{border-color:#f0c869;box-shadow:inset 0 0 18px #f0c86940,0 0 12px #f0c86930;animation:breathe 2.6s ease-in-out infinite}
.cell.l6{border-color:#ff7ab6;box-shadow:inset 0 0 16px #ff7ab633}
.cell.l8{border-color:#fff2b0;box-shadow:inset 0 0 20px #fff2b070,0 0 14px #ffd23f60;animation:breathe 1.8s ease-in-out infinite}
.cell.l7{border-color:#ffe08a;box-shadow:inset 0 0 18px #ffe08a50,0 0 12px #ff7ab640;animation:breathe 2.2s ease-in-out infinite}
.ph{display:grid;place-items:center;width:100%;height:100%;font-size:28px;color:var(--mut)}
.rt{position:absolute;right:6px;top:15px;font-size:9.5px;font-weight:600;color:var(--teal);opacity:.9;pointer-events:none;line-height:1;text-shadow:0 1px 2px #000a}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}50%{transform:translateY(0)}65%{transform:translateY(-4px)}80%{transform:translateY(0)}}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes ring{0%,100%{outline-offset:2px;outline-color:#4fd1b0aa}50%{outline-offset:6px;outline-color:#4fd1b000}}
.inc .egg.plus.hop{opacity:1;color:var(--teal);animation:hop 1.2s ease-in-out infinite}
.cell.locked.hop svg,.cell.locked.hop b,.inc.locked.hop svg,.inc.locked.hop b{animation:hop 1.2s ease-in-out infinite}
nav .dot.on ~ .ni,nav button:has(.dot.on) .ni{animation:hop 1.4s ease-in-out infinite}
.cell.tapme{outline:2px solid #4fd1b0aa;animation:ring 1.3s ease-in-out infinite}

#hintTxt{font:700 13px Outfit,system-ui,sans-serif;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#0c0e18;stroke-width:4px;stroke-linejoin:round}
.choicehelp{font-size:12px;color:var(--mut);line-height:1.45;margin:10px 4px 0;text-align:left}
.choicehelp b{color:var(--txt)}
.xp{position:absolute;top:5px;left:12%;right:12%;height:4px;border-radius:2px;background:#ffffff22;pointer-events:none;overflow:hidden}
.xp i{display:block;height:100%;background:var(--teal);box-shadow:0 0 6px var(--teal)}
.upi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ok);background:#4fd1b022;border:1.5px solid #4fd1b066}
.upi svg{width:20px;height:20px}
.cell.mergeable::after{content:'';position:absolute;inset:-1px;border-radius:16px;border:1.5px solid var(--teal);animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
.cell.pop{animation:popc .45s ease-out}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(1.02,.975)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes popc{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.7}}
#info{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 6px 5px 14px;background:var(--surf2);border:1px solid var(--line);border-radius:14px;font-size:14px}
#info .nm{font-weight:600;font-size:16px}
#info .hintx{color:var(--mut);font-size:13px;line-height:1.15;margin:0 auto;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;color:#1a1303;padding:8px 16px;border-radius:12px;background:linear-gradient(#f3cd78,#d9a443);box-shadow:inset 0 1px 0 #fff6,0 4px 14px #e8b85a26;line-height:1.1;letter-spacing:.2px}
.btn:active{transform:scale(.97);filter:brightness(.94)}
.btn.green{background:linear-gradient(#6fe0c5,#3fb996);color:#04201a;box-shadow:inset 0 1px 0 #fff5,0 4px 14px #4fd1b026}
.btn.red{background:#e5646e1c;color:#ff9aa2;border:1px solid #e5646e55;box-shadow:none}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.btn.dim{background:var(--surf2);color:var(--mut);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .mi{width:1.05em;height:1.05em}
.btn .pi{width:13px;height:13px;flex:none}
.btn .pi svg{width:100%;height:100%;display:block}

#spare{flex:1 1 0;min-height:0}
/* incubators */
#incs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.inc{position:relative;height:92px;border-radius:16px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:7px;cursor:pointer}
.inc .egg{width:38px;height:44px;transition:transform .1s;filter:drop-shadow(0 4px 4px #0006)}
.inc .egg svg{width:100%;height:100%;display:block}
.inc .egg.plus{opacity:.35;width:26px;height:26px;margin-top:9px;color:var(--txt);filter:none}
.inc .tm{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.1;font-weight:500}
.inc .bar{position:absolute;left:10px;right:10px;bottom:8px;height:4px;border-radius:3px;background:#ffffff16}
.inc .bar i{display:block;height:100%;border-radius:3px;background:var(--gold);width:0}
.inc.ready{border-color:var(--gold);background:#e8b85a14;animation:readyglow 1.4s ease-in-out infinite}
.inc.ready .egg{animation:shake .7s ease-in-out infinite}
.inc.ready .tm{color:var(--gold);font-weight:600}
.inc.shake .egg{animation:shake .25s}
.inc .skip{position:absolute;top:5px;right:5px;z-index:2;display:flex;align-items:center;gap:3px;padding:1px 6px 1px 4px;border-radius:999px;border:1px solid var(--line);background:#0c0e18cc;font-size:9.5px;font-weight:600;color:var(--gold);letter-spacing:.4px}
.inc .skip svg{width:9px;height:9px}
.inc.locked{justify-content:center;padding-top:0;gap:1px;color:var(--mut)}
.inc.locked svg{width:24px;height:24px;color:#ffffff55}
.inc.locked b{font-size:13px;color:var(--gold);font-weight:600}
.inc.locked span{font-size:10.5px;color:var(--mut)}
@keyframes readyglow{0%,100%{box-shadow:0 0 0 0 #e8b85a00}50%{box-shadow:0 0 16px 1px #e8b85a55}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}

/* tab bar */
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:12px -12px 0;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:#090b14;border-top:1px solid var(--line)}
#nav button{position:relative;overflow:hidden;height:68px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px}
#nav button:active{background:var(--surf);color:var(--txt)}
#nav .ni{width:32px;height:32px;display:block}
#nav span.l{font-size:13.5px;font-weight:600;letter-spacing:.3px;line-height:1}
#nav button{color:#c3c9dc}
#nav button:nth-child(1),#nav button:nth-child(4){color:#f0d9a0}
@keyframes gleam{0%,60%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes glowp{0%,100%{box-shadow:0 0 0 0 #e8b85a00}50%{box-shadow:0 0 14px 1px #e8b85a66}}
#nav button:nth-child(1)::after,#nav button:nth-child(4)::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 38%,#ffffff40 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:gleam 6s ease-in-out infinite}
#nav button:nth-child(4)::after{animation-delay:3s}
#nav button:has(.dot.on){animation:glowp 1.8s ease-in-out infinite}
#nav button:has(.dot.on)::after{animation-duration:2.6s}
#nav .dot{width:12px;height:12px;top:7px}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #090b14;font-size:0;display:none}
.dot.on{display:block}

/* sheets */
#sheet{position:fixed;inset:0;z-index:50;background:#05060cc0;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
#sheetCard{position:relative;width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:#141829;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out;color:var(--txt)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);color:var(--mut);display:grid;place-items:center;z-index:3}
.x svg{width:16px;height:16px}
h2{margin:0 0 4px;max-width:calc(100% - 50px);font-size:21px;font-weight:600;letter-spacing:-.2px;color:var(--txt)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px;line-height:1.3}
.card{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.card .em{width:44px;height:50px;flex:none;display:grid;place-items:center}
.card .em svg{width:100%;height:100%;display:block}
.card .tx{flex:1;font-size:12.5px;color:var(--mut);line-height:1.3}
.card .tx b{display:block;font-size:16px;color:var(--txt);font-weight:600}
.od{display:inline-flex;align-items:center;gap:4px;margin:3px 10px 0 0;font-size:11.5px;color:var(--mut);line-height:1.3}
.od::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.pb{height:5px;border-radius:3px;background:#ffffff16;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--gold);border-radius:3px}
.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.tile{aspect-ratio:1;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;position:relative;padding:3px}

.day b svg{height:100%;width:auto;display:inline-block}
.day.now{border-color:var(--gold);background:#e8b85a18;color:var(--txt)}

{ const c = document.getElementById('candycss'); try { if (c && c.sheet && c.sheet.cssRules.length > 20 && document.getElementById('calmcss').disabled) theme = 'candy'; } catch (e) {} }

      h += `<div class="cell locked ${k === S.unlocked ? 'next' : ''}" data-i="${k}" data-act="unlockSlot" data-k="${k}">${ICON.lock}<b>${fmt(slotCost(k))}</b></div>`; continue;
    }
    const c = S.slots[k];
    if (!c) { h += `<div class="cell empty" data-i="${k}"></div>`; continue; }
    const m = c.l < MAXL && pairs[c.s] >= 2;
    h += `<div class="cell l${c.l} ${m ? 'mergeable' : ''} ${k === sel ? 'sel' : ''} ${k === tapMe ? 'tapme' : ''}" data-i="${k}"><div class="cr" style="animation-delay:-${(k * 0.37) % 2.2}s">${creatureImg(c.s)}</div><div class="lv">${stars(c.l)}</div><div class="rt">${fmtRate(crInc(c) * totalMult())}</div>${c.x ? `<div class="xp"><i style="width:${c.x / need(c.l) * 100}%"></i></div>` : ''}</div>`;
  }
  g.innerHTML = h;
  // info
  const c = sel >= 0 ? S.slots[sel] : null, inf = $('info');
  if (c) inf.innerHTML = `<span><span class="nm" style="color:${RAR[(c.s / 8) | 0].c}">${NAMES[c.s]}</span> <span style="color:var(--mut)">Lv${c.l}${c.l >= MAXL ? ' MAX' : c.x ? ' (' + c.x + '/' + need(c.l) + ')' : ''} · ${fmtRate(crInc(c) * totalMult())}/s</span></span><button class="btn red sm" data-act="sell" data-k="${sel}">${sellArm === sel ? 'Tap again to sell' : 'Sell ' + fmt(crInc(c) * SELL_MUL)} ${COIN}</button>`;
  else inf.innerHTML = `<span class="hintx">Drag two of the same pet together to merge them!</span>`;
  incNow = income(); renderInc(); hud(true); dots(); goal();
}
function renderInc() {
  let h = '';
  for (let i = 0; i < 3; i++) {
    if (i >= S.incs) { h += `<div class="inc locked" data-act="unlockInc">${ICON.lock}<b>${fmt(INC_COST)}</b><span>3rd nest</span></div>`; continue; }
    const e = S.eggs[i];
    if (!e) h += `<div class="inc" data-act="go" data-go="eggs"><div class="egg plus">${ICON.plus}</div><span class="tm">Add egg</span></div>`;
    else h += `<div class="inc" data-i="${i}" data-act="egg"><div class="egg">${eggSVG(e.t)}</div><span class="tm"></span><div class="bar"><i></i></div>${Ads.available() ? `<button class="skip" data-act="adSkip" data-i="${i}">${ICON.play}SKIP</button>` : ''}</div>`;
  }
  $('incs').innerHTML = h;
  tickInc();
}
function tickInc() {
  const now = Date.now();
  // the device clock jumped back (wrong time, then synced): no timer may be further away than its own full duration
  S.eggs.forEach(e => { if (e) { const cap = now + EGGS[e.t].time * 1000; if (e.end > cap) e.end = cap; } });
  if (S.boostUntil > now + BOOST_MAX) S.boostUntil = now + BOOST_MAX;
  if (S.freeEggAt > now + FREE_EGG_COOLDOWN) S.freeEggAt = now + FREE_EGG_COOLDOWN;
  { const canEgg = S.coins >= eggCost(0);                // jump where something can be done right now
    document.querySelectorAll('#incs .egg.plus').forEach(e => e.classList.toggle('hop', canEgg));
    const nx = document.querySelector('.cell.locked.next'); if (nx) nx.classList.toggle('hop', S.coins >= slotCost(S.unlocked));
    const li = document.querySelector('#incs .inc.locked'); if (li) li.classList.toggle('hop', S.coins >= INC_COST);
    const ds = $('dotShop'); if (ds) ds.classList.toggle('on', S.perk < PERK_MAX && S.coins >= perkCost(S.perk)); }
  document.querySelectorAll('#incs .inc[data-i]').forEach(el => {
    const i = +el.dataset.i, e = S.eggs[i]; if (!e) return;
    const left = e.end - now, tot = EGGS[e.t].time * 1000, ready = left <= 0;
    el.classList.toggle('ready', ready);
    if (ready && !e.pinged) { e.pinged = true; if (tickInc.armed) { sfx('ready'); toast('An egg is ready to hatch!'); } }   // once per egg
    el.querySelector('.tm').textContent = ready ? 'TAP TO HATCH!' : fmtTime(left);
    el.querySelector('.bar i').style.width = (ready ? 100 : 100 - left / tot * 100) + '%';
    const sk = el.querySelector('.skip'); if (sk) sk.style.display = ready ? 'none' : '';
  });
}
let lastCoins = '', lastRate = '', lastBoost = '';
function hud(force) {
  const c = fmt(Math.max(0, S.coins - flying)); if (c !== lastCoins || force) { $('coins').textContent = c; lastCoins = c; }
  const r = fmtRate(incNow) + '/s'; if (r !== lastRate || force) { $('rate').textContent = r; lastRate = r; }
  const b = $('boost'), left = S.boostUntil - Date.now();
  const bt = left > 0 ? 'x2 ' + fmtTime(left) : '';
  if (bt !== lastBoost || force) {
    lastBoost = bt;
    if (bt) { b.classList.remove('hidden'); b.innerHTML = `<span class="mi">${ICON.bolt}</span><b>${bt}</b>`; } else b.classList.add('hidden');
  }
}
function goal() {
  const d = Object.keys(S.disc).length, b = Math.round((collectionMult() - 1) * 100);
  $('goal').innerHTML = `<span class="ni">${ICON.book}</span><div class="gt"><div class="gl"><span>Collection <b>${d}/${NSP}</b></span><em>+${b}% income</em></div><div class="gb"><i style="width:${d / NSP * 100}%"></i></div></div>`;
}
function dots() {
  $('dotDaily').classList.toggle('on', anyClaimable());
  $('dotBoost').classList.toggle('on', Ads.available() && Date.now() >= S.freeEggAt);
  const hint = $('hint');
  const anyCr = S.slots.some(Boolean), anyEgg = S.eggs.some(Boolean);
  hint.textContent = !anyCr && S.eggs.some(e => e) ? 'Tap your egg to hatch it!' :
    !anyCr && !anyEgg ? 'Add an egg to a nest' :
    (S.hatched <= 2 ? 'Tap a pet for bonus coins!' : '');
}

/* ================= SHEETS ================= */
let curSheet = null;
function openSheet(fn) { if (pendingNew) resolveNew('release'); curSheet = fn; $('sheet').classList.remove('hidden'); fn(); }
function closeSheet() { curSheet = null; pendingOffline = 0; $('sheet').classList.add('hidden'); if (pendingNew) resolveNew('release'); }   // closing without a choice = release
function setSheet(h) { $('sheetBody').innerHTML = h; $('sheetCard').scrollTop = 0; }
function refreshSheet() { if (curSheet) { const st = $('sheetCard').scrollTop; curSheet(); $('sheetCard').scrollTop = st; } }

function sheetEggs() {
  let h = `<h2>Shop</h2><div class="sub">Hatch pets. Each pet earns coins every second.</div>`;
  EGGS.forEach((e, t) => {
    const odds = e.w.map((w, r) => w ? `<span class="od" style="--c:${RAR[r].c}">${RAR[r].n[0] + RAR[r].n.slice(1).toLowerCase()} ${w}%</span>` : '')
    .filter(Boolean).join('');
    h += `<div class="card"><div class="em">${eggSVG(t)}</div><div class="tx"><b>${e.n}</b>Hatches in ${fmtTime(e.time * 1000)}<br>${odds}</div><button class="btn ${S.coins < eggCost(t) ? 'dim' : 'green'}" data-act="buy" data-t="${t}">${COIN}${fmt(eggCost(t))}</button></div>`;
  });
  const pc = perkCost(S.perk), maxed = S.perk >= PERK_MAX;
  h += `<h2 style="margin-top:14px">Habitat upgrade</h2><div class="card"><div class="em"><span class="upi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg></span></div><div class="tx"><b>Better care <span style="color:var(--mut)">Lv ${S.perk}/${PERK_MAX}</span></b>+${Math.round((PERK_MUL - 1) * 100)}% income per level. Now x${perkMult().toFixed(2)}</div>${maxed ? '<span style="color:var(--ok);font-weight:700">MAX</span>' : `<button class="btn ${S.coins < pc ? 'dim' : 'green'}" data-act="buyPerk">${COIN}${fmt(pc)}</button>`}</div>`;
  setSheet(h);
}
function buyPerk() {
  if (S.perk >= PERK_MAX) return;
  const c = perkCost(S.perk);
  if (S.coins < c) { toast('Not enough coins'); sfx('err'); return; }
  S.coins -= c; S.perk++; sfx('buy'); toast('Better care - income x' + perkMult().toFixed(2)); save(); render(); refreshSheet();
}
function sheetAlbum() {
  const d = Object.keys(S.disc).length;
  let h = `<h2>Album ${d}/${NSP}</h2><div class="sub">Every new pet: +3% income. Every MAX-level pet: +10%.<br>Your bonus now: <b style="color:var(--ok)">+${Math.round((collectionMult() - 1) * 100)}%</b></div>`;
  for (let r = 0; r < 5; r++) {
    h += `<div class="rh" style="--c:${RAR[r].c}">${RAR[r].n}</div><div class="alb">`;
    for (let k = 0; k < 8; k++) {
      const i = r * 8 + k, v = S.disc[i];
      h += v ? `<div class="tile" style="border-color:${RAR[r].c}99">${creatureImg(i, true)}<span>${stars(v)}</span></div>` : `<div class="tile un">${creatureImg(i, true)}<div class="q">?</div></div>`;
    }
    h += `</div>`;
  }
  setSheet(h);
}
function sheetDaily() {
  ensureQuests();
  const st = dailyState(); let h = `<h2>Daily gift</h2><div class="days">`;
  for (let d = 1; d <= 7; d++) {
    const cls = st.can ? (d === st.day ? 'now' : d < st.day ? 'past' : '') : (d <= st.day ? 'past' : '');
    h += `<div class="day ${cls}">Day ${d}<b>${d === 7 ? eggSVG(2) : ICON.coin}</b></div>`;
  }
  h += `</div>`;
  const rw = dailyReward(st.day);
  h += st.can ? `<div class="row" style="margin:0 0 6px"><button class="btn green" data-act="claimDaily">Claim ${COIN}${fmt(rw.coins)}${rw.egg !== undefined ? ' + Golden Egg' : ''}</button></div>` : `<div class="sub">Come back tomorrow to keep your streak!</div>`;
  h += `<h2 style="margin-top:14px">Today's quests</h2>`;
  S.q.items.forEach((q, i) => {
    const D = QDEF[q.k], can = !q.done && q.have >= D.need;
    h += `<div class="card"><div class="tx"><b>${D.txt}</b>${Math.min(q.have, D.need)} / ${D.need}<div class="pb"><i style="width:${Math.min(100, q.have / D.need * 100)}%"></i></div></div>${q.done ? '<span style="color:var(--ok);font-weight:700">DONE</span>' : `<button class="btn ${can ? 'green' : 'dim'}" data-act="claimQ" data-i="${i}" ${can ? '' : 'disabled'}>${COIN}${fmt(questReward())}</button>`}</div>`;
  });
  setSheet(h);
}
function sheetBoost() {
  const ready = Date.now() >= S.freeEggAt, ad = Ads.available();
  let h = `<h2>Boosts</h2><div class="sub">Totally optional. Watch a short ad and get a reward.${ad ? '' : '<br><b>Ads are not available right now.</b>'}</div>`;
  h += `<div class="card"><div class="em">${ICON.bolt}</div><div class="tx"><b>Double income</b>x2 coins for 3 minutes (stacks up to 15)</div><button class="btn" data-act="adBoost" ${ad ? '' : 'disabled'}>${AD}WATCH</button></div>`;
  h += `<div class="card"><div class="em">${eggSVG(1)}</div><div class="tx"><b>Free Silver Egg</b>${ready ? 'Ready to hatch instantly' : 'Next one in ' + fmtTime(S.freeEggAt - Date.now())}</div><button class="btn" data-act="adEgg" ${ready && ad ? '' : 'disabled'}>${AD}WATCH</button></div>`;
  h += `<div class="sub" style="margin-top:12px">Tip: the blue SKIP tag on a hatching egg finishes it right away.</div>`;
  setSheet(h);
}
function showReveal(s, isNew) {
  const r = (s / 8) | 0;
  openSheet(() => setSheet(`<div class="reveal"><div class="rar" style="--c:${RAR[r].c}">${RAR[r].n}</div><div class="stage" style="--c:${RAR[r].c}77"><div class="big">${creatureImg(s)}</div></div><div class="nm">${NAMES[s]}</div>${isNew ? '<div class="newtag">NEW!</div>' : ''}<div class="sub" style="margin:4px 0 0">Earns ${fmtRate(baseInc(s))} coins/s</div><div class="row"><button class="btn green" data-act="close">Nice!</button></div></div>`));
  const [x, y] = [innerWidth / 2, innerHeight * 0.45]; burst(x, y, RAR[r].c, 30); if (isNew) burst(x, y, '#fff', 14);
}
let pendingOffline = 0;
function checkOffline() {
  const dt = Math.min((Date.now() - S.lastSeen) / 1000, OFFLINE_MAX);
  if (!(dt > 1)) return;                                 // also ignores a clock that moved backwards
  const earn = Math.floor(incomeBase() * dt * OFFLINE_RATE);
  S.lastSeen = Date.now();
  if (earn < 1) return;
  S.coins += earn;
  if (dt < 30) { save(); return; }                       // short absence: credit quietly, no popup
  pendingOffline = earn;
  openSheet(() => setSheet(`<div class="reveal"><h2>Welcome back!</h2><div class="sub">Your pets kept working for ${fmtTime(dt * 1000)}</div><div class="bignum">+${fmt(earn)} ${COIN}</div><div class="row"><button class="btn green" data-act="close">Collect</button>${Ads.available() ? `<button class="btn" data-act="adOffline">${AD}x2 (+${fmt(earn)})</button>` : ''}</div></div>`));
  save(); render();
}

/* ================= INPUT ================= */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (ev.target === $('sheet')) closeSheet(); return; }
  audio();
  const a = el.dataset.act;
  if (a === 'close') closeSheet();
  else if (a === 'go') { const f = Object.prototype.hasOwnProperty.call({ eggs: 1, album: 1, daily: 1, boost: 1 }, el.dataset.go) ? { eggs: sheetEggs, album: sheetAlbum, daily: sheetDaily, boost: sheetBoost }[el.dataset.go] : null; if (typeof f === 'function') openSheet(f); }
  else if (a === 'buy') buyEgg(+el.dataset.t);
  else if (a === 'buyPerk') buyPerk();
  else if (a === 'sell') {
    const k = +el.dataset.k;
    if (sellArm === k) sell(k);                          // second tap confirms
    else { sellArm = k; clearTimeout(sellT); sellT = setTimeout(() => { sellArm = -1; render(); }, 3000); render(); }
  }
  else if (a === 'releaseNew') { resolveNew('release'); closeSheet(); }
  else if (a === 'replaceWeak') { resolveNew('replace'); closeSheet(); }
  else if (a === 'unlockInc') unlockInc();
  else if (a === 'unlockSlot') unlockSlot(+el.dataset.k);   // on click (not on touch-start): a stray touch must not spend coins
  else if (a === 'egg') {
    ev.stopPropagation();
    const i = +el.dataset.i, e = S.eggs[i]; if (!e) return;
    if (e.end <= Date.now()) hatch(i);
    else { e.end -= Math.max(500, EGGS[e.t].time * 10); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); sfx('pop'); tickInc(); }
  }
  else if (a === 'adSkip') { ev.stopPropagation(); watch('skip_egg', () => Rewards.skipEgg(+el.dataset.i), 'Egg is ready!'); }
  else if (a === 'adBoost') watch('boost', Rewards.boost, 'x2 income!');
  else if (a === 'adEgg') {
    if (S.eggs.findIndex((e, k) => k < S.incs && !e) < 0) { toast('Free an incubator first'); sfx('err'); }   // don't burn an ad on a reward that can't be placed
    else watch('free_egg', Rewards.freeEgg, 'Free egg is ready in the incubator!');
  }
  else if (a === 'adOffline') {
    const p = pendingOffline; if (!p) return;
    pendingOffline = 0;                                  // blocks a second tap while the ad runs
    const ok = await watch('offline_x2', () => Rewards.offline2x(p), 'Doubled!');
    if (ok) closeSheet(); else pendingOffline = p;
  }
  else if (a === 'claimDaily') {
    const st = dailyState(); if (!st.can) return;
    const rw = dailyReward(st.day); S.coins += rw.coins; if (rw.egg !== undefined) giveEgg(rw.egg);
    S.daily = { last: today(), streak: st.day }; sfx('hatch'); save(); render(); refreshSheet();
  }
  else if (a === 'claimQ') {
    const q = S.q.items[+el.dataset.i]; if (!q || q.done || q.have < QDEF[q.k].need) return;
    q.done = true; const r = questReward(); S.coins += r; sfx('buy'); save(); render(); refreshSheet();
  }
});
$('btnTheme').onclick = () => setTheme(theme === 'candy' ? 'calm' : 'candy');
$('btnSound').onclick = () => { audio(); S.mute = !S.mute; setSnd(); save(); };

// drag & drop / tap on the habitat
let drag = null;
function clearDragUI() {
  $('ghost').classList.add('hidden');
  document.querySelectorAll('.cell.target,.cell.src').forEach(c => c.classList.remove('target', 'src'));
}
addEventListener('blur', () => { if (drag) { drag = null; clearDragUI(); render(); } });   // mouse released outside the window
$('grid').addEventListener('pointerdown', e => {
  audio();
  const cell = e.target.closest('.cell'); if (!cell) return;
  const k = +cell.dataset.i;
  if (k >= S.unlocked) return;
  if (drag) { if (drag.id !== e.pointerId) return; drag = null; clearDragUI(); }   // 2nd finger: ignored; same pointer again: the old drag lost its "up" event, drop it
  if (!S.slots[k]) { sel = -1; render(); return; }
  drag = { id: e.pointerId, k, sx: e.clientX, sy: e.clientY, moved: false, cell };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!S.slots[drag.k]) { drag = null; clearDragUI(); render(); return; }   // the pet vanished mid-drag (e.g. sold with a second finger)
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 9) {
    drag.moved = true; drag.cell.classList.add('src');
    const gh = $('ghost'); gh.innerHTML = creatureImg(S.slots[drag.k].s); gh.classList.remove('hidden');
  }
  if (!drag.moved) return;
  const gh = $('ghost'); gh.style.left = e.clientX + 'px'; gh.style.top = e.clientY + 'px';
  document.querySelectorAll('.cell.target').forEach(c => c.classList.remove('target'));
  const t = document.elementFromPoint(e.clientX, e.clientY), c = t && t.closest && t.closest('.cell');
  if (c && +c.dataset.i < S.unlocked && c !== drag.cell) c.classList.add('target');
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  $('ghost').classList.add('hidden');
  document.querySelectorAll('.cell.target').forEach(c => c.classList.remove('target'));
  if (cancel) { render(); return; }
  if (!d.moved) { sel = d.k; render(); petTap(d.k, $('grid').children[d.k]); return; }
  const t = document.elementFromPoint(e.clientX, e.clientY), c = t && t.closest && t.closest('.cell');
  if (c && +c.dataset.i < S.unlocked) drop(d.k, +c.dataset.i); else render();
}
addEventListener('pointerup', e => endDrag(e, false));
addEventListener('pointercancel', e => endDrag(e, true));

/* ================= COACH: hints that show what can be done ================= */
let lastInput = Date.now();
['pointerdown', 'keydown', 'click'].forEach(t => addEventListener(t, () => { lastInput = Date.now(); coach(); }, true));
function findPair() {                                    // same species, none at MAX; equal levels first (no income lost)
  let best = null;
  for (let a = 0; a < S.unlocked; a++) for (let b = a + 1; b < S.unlocked; b++) {
    const A = S.slots[a], B = S.slots[b];
    if (!A || !B || A.s !== B.s || A.l >= MAXL || B.l >= MAXL) continue;
    if (A.l === B.l) return [a, b];
    if (!best) best = [a, b];
  }
  return best;
}
const hintState = { sig: '' };
function coach() {
  const svg = $('hintSvg'); if (!svg) return;
  let pair = null;
  const wait = S.hatched <= 12 ? 1200 : 3500;            // newcomers get help sooner
  if (!drag && curSheet === null && !pendingNew && Date.now() - lastInput >= wait) pair = findPair();
  if (!pair) { if (hintState.sig) { svg.classList.add('hidden'); hintState.sig = ''; } return; }
  const cells = $('grid').children, ea = cells[pair[0]], eb = cells[pair[1]]; if (!ea || !eb) return;
  const [x1, y1] = centerOf(ea), [x2, y2] = centerOf(eb);
  const sig = [pair.join('-'), Math.round(x1), Math.round(y1), Math.round(x2), Math.round(y2), S.hatched <= 20].join();
  if (sig === hintState.sig) return;
  hintState.sig = sig;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, r = ea.getBoundingClientRect().width * 0.3;
  const sx = x1 + ux * r, sy = y1 + uy * r, ex = x2 - ux * r, ey = y2 - uy * r, cx = (x1 + x2) / 2 - uy * len * 0.16, cy = (y1 + y2) / 2 + ux * len * 0.16;
  const d = 'M' + sx + ',' + sy + ' Q' + cx + ',' + cy + ' ' + ex + ',' + ey;
  $('hintPath').setAttribute('d', d); $('hintDot').firstElementChild.setAttribute('path', d);
  const t = $('hintTxt'); t.textContent = S.hatched <= 20 ? 'Drag to merge' : ''; t.setAttribute('x', cx); t.setAttribute('y', cy - 12);
  svg.classList.remove('hidden');
}
// one-time explanations (kept outside the save on purpose)
function tip(id, msg) { try { const k = 'oddlings_tips', t = JSON.parse(localStorage.getItem(k) || '{}'); if (t[id]) return; t[id] = 1; localStorage.setItem(k, JSON.stringify(t)); toast(msg); } catch (e) {} }

/* ================= MAIN LOOP ================= */
let lastT = performance.now(), acc = 0;
function loop(now) {
  if (!Number.isFinite(now)) { requestAnimationFrame(loop); return; }   // a broken timestamp must not poison lastT (coins would stop forever)
  const dt = Math.max(0, Math.min((now - lastT) / 1000, 1)); lastT = now;   // never negative: a frame timestamp can be older than lastT
  S.coins += incNow * dt;
  hud(false); acc += dt;
  if (acc > 0.25) { acc = 0; incNow = income(); tickInc(); coach(); }   // income is cached: no per-frame recomputation
  requestAnimationFrame(loop);
}
setInterval(() => { if (rescue()) render(); save(); dots(); if (curSheet === sheetBoost) refreshSheet(); }, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  else { flying = 0; checkOffline(); lastT = performance.now(); }
});
// Same game open in a second tab/window: whoever saved last wins, the other one adopts it (no stale tab may overwrite newer progress).
addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try {
    const raw = JSON.parse(e.newValue); if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return;
    const n = clean(raw);
    if (drag) { drag = null; clearDragUI(); }
    S = n; sel = -1; sellArm = -1; flying = 0; ensureQuests(); render(); refreshSheet();
  } catch (err) {}
});
addEventListener('pagehide', () => { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });

if (location.pathname.indexOf('/play/') === 0) $('btnHome').style.display = 'grid';      // on 6fingergames.com: a way back to the game list
load(); ensureQuests();
fillIcons(); setSnd();
render(); checkOffline(); tickInc.armed = true;
requestAnimationFrame(loop);
</script>
</body>
