<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="comboLbl"></div>
    <div id="bestBox"><span data-t="best">Best</span> <b id="hudBest">0</b></div>
  </div>

  <div id="topBtns">
    <a class="round" id="btnHome" href="/online/" aria-label="More games" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
    </a>
    <button class="round hidden" id="btnPause" aria-label="Pause">
      <svg viewBox="0 0 24 24" class="fill"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <button class="round" id="btnSnd" aria-label="Sound"></button>
  </div>

  <div id="banner"></div>
  <div id="toast"></div>

  <section id="menu" class="screen">
    <h1 class="logo" id="logo" aria-label="ONE PIXEL OFF"></h1>
    <div class="menu-buttons">
      <button class="btn pink big" id="btnStart" data-t="start">Start</button>
      <button class="btn ghost" id="btnSettings" data-t="settings">Settings</button>
      <button class="btn ghost" id="btnInfo" data-t="info">Info</button>
      <div class="menuStats"><span><span data-t="best">Best</span> <b id="menuBest">0</b></span><span><span data-t="blocks">Blocks</span> <b id="menuBlocks">0</b></span></div>
    </div>
  </section>

  <section id="pause" class="screen dim hidden">
    <div class="card">
      <h2 data-t="paused">Paused</h2>
      <div class="menu-buttons">
        <button class="btn pink big" id="btnResume" data-t="resume">Resume</button>
        <button class="btn ghost" id="btnPauseMenu" data-t="menu">Menu</button>
      </div>
    </div>
  </section>

  <section id="over" class="screen dim hidden">
    <div class="card">
      <h2 data-t="gameover">Game over</h2>
      <div class="lbl" data-t="score">Score</div>
      <div class="bigScore" id="ovScore">0</div>
      <div class="newbest hidden" id="ovNew" data-t="newbest">New best!</div>
      <div class="statsRow">
        <span><span data-t="best">Best</span> <b id="ovBest">0</b></span>
        <span><span data-t="blocks">Blocks</span> <b id="ovBlocks">0</b></span>

        <button class="btn pink big" id="btnAgain" data-t="again">Play again</button>
        <button class="btn ghost" id="btnOverMenu" data-t="menu">Menu</button>
      </div>
    </div>
  </section>

  <section id="settings" class="screen dim hidden">
    <div class="card">
      <h2 data-t="settings">Settings</h2>
      <div class="lbl" data-t="volume">Volume</div>
      <input type="range" id="vol" min="0" max="100" value="80">
      <div class="lbl" data-t="language">Language</div>
      <div class="langs" id="langs"></div>
      <button class="btn ghost" id="btnSetBack" data-t="back">Back</button>
    </div>
  </section>

  <section id="info" class="screen dim hidden">

      <p data-t="how2"></p>
      <p data-t="how3"></p>
      <p class="about" id="about"></p>
      <button class="btn ghost" id="btnInfoBack" data-t="back">Back</button>
    </div>
  </section>
</div>
