html[lang="fr"] .set-page .set-label.aim{font-size:29px}

.demo-stamp{position:absolute;left:50%;top:205px;transform:translateX(130px) rotate(-12deg);padding:2px 14px;border:4px solid var(--red);border-radius:8px;color:var(--red);font:400 34px/1.1 var(--hand);letter-spacing:3px;opacity:.9;pointer-events:none;z-index:3}
.demo-sheet{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:20px} 
.demo-sheet .overlay-title,.demo-sheet .demo-body{transform:translateY(20px)}
.demo-sheet .overlay-title{padding-left:40px}

.demo-sheet .demo-buy{width:auto;min-width:256px;padding:0 38px;background-size:100% 100%;font-size:25px;white-space:nowrap}
.demo-sheet .demo-menu{margin-top:0;background:none;border:0;color:var(--ink);font:400 20px var(--hand);text-decoration:underline;opacity:.75;cursor:pointer}
.demo-sheet .demo-menu:hover{opacity:1}
