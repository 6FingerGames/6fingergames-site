html[lang="fr"] .set-page .set-label.aim{font-size:29px}
html:is([lang="de"],[lang="fr"]) .help-page .help-p{width:566px} 
html[lang="ko"] .help-page .help-p{width:588px}
html[lang="ko"] body{word-break:keep-all} 
html[lang="fr"] .help-page .help-back span{font-size:26px}
html:is([lang="de"],[lang="fr"]) .res-title{font-size:30px} 
html:is([lang="de"],[lang="fr"]) .piece.hardness .hard-label{font-size:16px}
html:is([lang="de"],[lang="fr"]) .diff-sheet .btn.diff-pick[data-diff="hard"]{font-size:23px}

.demo-stamp{position:absolute;left:50%;top:205px;transform:translateX(130px) rotate(-12deg);padding:2px 14px;border:4px solid var(--red);border-radius:8px;color:var(--red);font:400 34px/1.1 var(--hand);letter-spacing:3px;opacity:.9;pointer-events:none;z-index:3}
.demo-sheet{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:20px} 
.demo-sheet .overlay-title,.demo-sheet .demo-body{transform:translateY(20px)}
.demo-sheet .overlay-title{padding-left:40px}  
.demo-sheet .demo-body{align-self:flex-start;width:512px;max-width:none;margin:-2px 0 0 118px;font-size:27px;line-height:1.22} 
html[lang="ka"] .demo-sheet .demo-body{font-size:28px;line-height:1.28;width:532px;margin-left:112px} 
html[lang="ru"] .demo-sheet .demo-body{font-size:30px;line-height:1.12} 
html[lang="ko"] .demo-sheet .demo-body{width:490px;margin-left:124px} 
html[lang="ja"] .demo-sheet :is(.demo-title,.demo-body){font-weight:700} 
.demo-sheet .demo-title{display:inline-block;white-space:nowrap} 
.demo-sheet .demo-actions{flex-direction:column;align-items:center;justify-content:flex-end;gap:0;bottom:44px}
.demo-sheet .demo-buy{width:auto;min-width:256px;padding:0 38px;background-size:100% 100%;font-size:25px;white-space:nowrap}
.demo-sheet .demo-menu{margin-top:0;background:none;border:0;color:var(--ink);font:400 20px var(--hand);text-decoration:underline;opacity:.75;cursor:pointer}
.demo-sheet .demo-menu:hover{opacity:1}
.demo-sheet .demo-links{display:flex;align-items:baseline;justify-content:center;gap:12px} 
.demo-sheet .demo-dot{color:var(--ink);opacity:.55;font:400 20px var(--hand)}
.demo-sheet .demo-site{font-family:"Ink Latin","Segoe UI",Arial,sans-serif}
