/* glow sprite cache */
const glowCache = {};
function glow(hue){
  const key = Math.round(hue/8)*8;
  if(glowCache[key]) return glowCache[key];
  const c = document.createElement('canvas'); c.width=c.height=64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0, `hsla(${key},100%,88%,1)`);
  grd.addColorStop(0.25,`hsla(${key},100%,68%,0.85)`);
  grd.addColorStop(0.6, `hsla(${key},100%,55%,0.28)`);
  grd.addColorStop(1, `hsla(${key},100%,50%,0)`);
  g.fillStyle=grd; g.fillRect(0,0,64,64);
  glowCache[key]=c; return c;
}
function drawGlow(x,y,r,hue,alpha){
  ctx.globalAlpha = alpha===undefined?1:alpha;
  const s = glow(hue);
  ctx.drawImage(s, x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
}

/* ---------------- black hole, ray traced ----------------
   Each pixel follows a ray of light past the hole (Schwarzschild gravity, rs = 1)
   and collects the glowing disk where the ray crosses it. The ring over the top,
   the band across the shadow and the brighter side all come from the physics.
   Rendered on a small WebGL canvas and pasted into the game; the old flat
   drawing below stays as the fallback when WebGL is missing. */
const BHGL = (function(){
  const UV_H = 1.0, ASPECT = 1.75;          // sprite: height 2 uv, width 2*ASPECT uv
  const FOV = 0.27, DIST = 25.0, INCL = 0.16;
  const SHADOW_UV = 0.375;                  // apparent shadow radius in uv units (rs=1, D=25, FOV=.27)
  let cv = null, gl = null, prog = null, uTime, uRes, uFlash, lastT = -1, lastW = 0, lastH = 0, ok = false;
  const VS = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p; gl_Position = vec4(p,0.,1.); }';
  const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform float uTime, uFlash;
uniform vec2 uRes;
const float R_IN = 1.9, R_OUT = 10.0, PI = 3.14159265;
float hash(vec2 q){ return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453); }
// value noise that wraps every K cells along x, so the disk has no seam
float wnoise(vec2 q, float K){
  vec2 i = floor(q), f = fract(q); f = f*f*(3.0-2.0*f);
  float x0 = mod(i.x, K), x1 = mod(i.x + 1.0, K);
  return mix(mix(hash(vec2(x0, i.y)), hash(vec2(x1, i.y)), f.x),
             mix(hash(vec2(x0, i.y+1.0)), hash(vec2(x1, i.y+1.0)), f.x), f.y);
}
float gas(float ang, float r){
  // angle 0..1 around the disk, stretched along the orbit
  float a = ang / (2.0*PI);
  float v = 0.0, amp = 0.55, K = 18.0, rs = 3.2;
  for(int o = 0; o < 4; o++){
    v += amp * wnoise(vec2(a*K, r*rs), K);
    K *= 2.0; rs *= 2.1; amp *= 0.5;
  }
  return v;
}
vec4 disk(vec3 hit, vec3 dir){
  float r = length(hit.xz);
  if(r < R_IN || r > R_OUT) return vec4(0.0);
  float phi = atan(hit.z, hit.x);
  float omega = pow(r, -1.5) * 7.5;                 // Kepler: the inside turns faster
  float ang = mod(phi - uTime*omega, 2.0*PI);
  float n = gas(ang, r);
  float lanes = 0.55 + 0.45*sin(r*9.0 + n*3.0);     // thin bands
  float dens = smoothstep(R_IN, R_IN + 0.25, r) * (1.0 - smoothstep(R_OUT - 5.0, R_OUT, r));
  // Doppler beaming + gravitational redshift
  vec3 vel = sqrt(0.5 / r) * vec3(-hit.z, 0.0, hit.x) / r;
  float beta = length(vel);
  float gam = 1.0 / sqrt(1.0 - beta*beta);
  float cosT = dot(vel / beta, -normalize(dir));
  float g = 1.0 / (gam * (1.0 - beta*cosT)) * sqrt(1.0 - 1.0/r);
  float heat = pow(R_IN / r, 1.5);                  // hotter near the inner edge
  float I = dens * heat * pow(g, 0.85) * (0.5 + 0.9*n) * (0.75 + 0.25*lanes) * (5.6 + uFlash*2.5);
  vec3 cool = vec3(0.9, 0.3, 0.07), warm = vec3(1.0, 0.64, 0.3), hot = vec3(1.0, 0.95, 0.88);
  vec3 col = mix(cool, warm, clamp(I*0.8, 0.0, 1.0));
  col = mix(col, hot, clamp((I - 0.7)*0.7, 0.0, 1.0));
  col *= clamp(0.35 + I*0.65, 0.0, 1.0);
  float alpha = clamp(dens * (0.55 + 0.8*n) * (0.7 + 0.6*heat), 0.0, 1.0);
  return vec4(col, alpha);
}
void main(){
  vec2 uv = vec2(vUv.x * ${ASPECT.toFixed(3)}, vUv.y);
  vec3 ro = vec3(0.0, sin(${INCL.toFixed(3)}), -cos(${INCL.toFixed(3)})) * ${DIST.toFixed(1)};
  vec3 fw = normalize(-ro), rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw)), up = cross(fw, rt);
  vec3 p = ro, v = normalize(fw + (uv.x*rt + uv.y*up) * ${FOV.toFixed(3)});
  vec3 hc = cross(p, v); float h2 = dot(hc, hc);
  vec3 col = vec3(0.0); float a = 0.0, glow = 0.0, glowHot = 0.0; bool inside = false;
  for(int i = 0; i < 170; i++){
    float r2 = dot(p, p), r = sqrt(r2);
    if(r < 1.0){ inside = true; break; }
    if(r > ${(DIST*1.25).toFixed(1)} && dot(p, v) > 0.0) break;
    float dt = clamp(0.07*r, 0.025, 1.4);
    vec3 acc = -1.5 * h2 * p / (r2*r2*r);
    float rr = length(p.xz);
    if(rr > R_IN*0.8 && rr < R_OUT + 3.0)
      glow += dt * exp(-abs(p.y)*1.6) * pow(R_IN/rr, 1.2) * (1.0 - smoothstep(R_OUT - 4.0, R_OUT + 3.0, rr));
    if(r < 3.2) glowHot += dt * exp(-abs(p.y)*1.2) * pow(1.5/r, 3.0);   // light trapped near the photon sphere
    vec3 pn = p + v*dt;
    v += acc*dt;
    if(p.y * pn.y < 0.0){
      vec3 hit = mix(p, pn, p.y / (p.y - pn.y));
      vec4 d = disk(hit, v);
      col += (1.0 - a) * d.rgb * d.a;
      a += (1.0 - a) * d.a;
      if(a > 0.985) break;
    }
    p = pn;
  }
  float ga = inside ? 0.0 : clamp(glow*(0.07 + uFlash*0.05), 0.0, 0.8);   // warm haze around the disk
  col += (1.0 - a) * vec3(1.0, 0.56, 0.24) * ga;
  a += (1.0 - a) * ga;
  float gh = inside ? 0.0 : clamp(glowHot*(0.5 + uFlash*0.3), 0.0, 0.97);  // white-hot ring hugging the shadow
  col += (1.0 - a) * vec3(1.0, 0.9, 0.76) * gh;
  a += (1.0 - a) * gh;
  if(inside) a += (1.0 - a);                         // the shadow: solid black
  col = min(col, vec3(a));
  // fade at the sprite edges so it never shows a hard border
  float edge = (1.0 - smoothstep(0.82, 1.0, abs(vUv.y))) * (1.0 - smoothstep(0.9, 1.0, abs(vUv.x)));
  col *= edge; a *= edge;
  gl_FragColor = vec4(col, a);
}`;

  function init(){
    try{
      cv = document.createElement('canvas');
      gl = cv.getContext('webgl', { premultipliedAlpha:true, preserveDrawingBuffer:true, antialias:false, alpha:true })
        || cv.getContext('experimental-webgl', { premultipliedAlpha:true, preserveDrawingBuffer:true, alpha:true });
      if(!gl) return false;
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      uTime = gl.getUniformLocation(prog, 'uTime');
      uRes = gl.getUniformLocation(prog, 'uRes');
      uFlash = gl.getUniformLocation(prog, 'uFlash');
      return true;
    }catch(e){ console.warn('black hole shader off:', e); gl = null; return false; }
  }
  ok = init();

  // draws the hole centred at x,y with a shadow radius of r px
  function draw(x, y, r, time, flash){
    const hPx = r / SHADOW_UV * UV_H * 2, wPx = hPx * ASPECT;
    const q = ('ontouchstart' in window) ? Math.min(DPR || 1, 1.5) * 0.6 : Math.min(DPR || 1, 2);   // phones: fewer pixels to trace
    let cw = Math.round(wPx*q), ch = Math.round(hPx*q);
    const big = Math.max(cw, ch); if(big > 1200){ cw = Math.round(cw*1200/big); ch = Math.round(ch*1200/big); }
    if(cw !== lastW || ch !== lastH){ cv.width = cw; cv.height = ch; gl.viewport(0, 0, cw, ch); lastW = cw; lastH = ch; lastT = -1; }
    // the disk moves slowly, so 30 renders a second is plenty
    if(lastT < 0 || Math.abs(time - lastT) > 1/30 || flash > 0.01){
      gl.uniform1f(uTime, time); gl.uniform2f(uRes, cw, ch); gl.uniform1f(uFlash, flash || 0);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      lastT = time;
    }
    ctx.drawImage(cv, x - wPx/2, y - hPx/2, wPx, hPx);
  }
  return { get ok(){ return ok; }, draw };
})();

/* the black hole as the game draws it: ray traced when possible, flat drawing otherwise */
function drawGateBlackHole(x, y, r, phase, prog, flash){
  if(!BHGL.ok){ drawGateBlackHole2D(x, y, r, phase, prog, flash); return; }
  flash = flash || 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = Math.min(1, 0.2 + flash*0.4);
  ctx.drawImage(softGlowCv, -r*3.6, -r*3.6, r*7.2, r*7.2);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.rotate(-0.09);
  BHGL.draw(0, 0, r, phase*0.5, flash);
  ctx.rotate(0.09);
  ctx.restore();
}

/* Flat black hole drawing (used only when WebGL is missing).
   Its disk and lensed ring are painted once per size as top-down textures;
   every frame only turns them and squashes them flat, so it stays cheap. */
const bhCache = {};
function bhTextures(r){
  const dpr = Math.min(DPR||1, 1.5);
  const key = dpr+':'+Math.round(r);
  if(bhCache[key]) return bhCache[key];
  const rand = (()=>{ let s = 1234567; return ()=> (s = (s*16807) % 2147483647) / 2147483647; })();

  function ringTexture(rIn, rOut, stops, streaks, lanes, hotEdge){
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(rOut*2*dpr);
    const g = c.getContext('2d');
    g.scale(dpr,dpr); g.translate(rOut,rOut);
    const rg = g.createRadialGradient(0,0,rIn,0,0,rOut);
    for(const s of stops) rg.addColorStop(s[0], s[1]);
    g.fillStyle = rg;
    g.beginPath(); g.arc(0,0,rOut,0,6.2832); g.arc(0,0,rIn,0,6.2832,true); g.fill();
    // turbulent gas: thin bright arcs, denser and hotter near the inner edge
    g.lineCap = 'round';
    for(let i=0;i<streaks;i++){
      const t = Math.pow(rand(), 1.7);
      const rr = rIn + (rOut-rIn)*t;
      const a0 = rand()*6.2832, len = 0.25 + rand()*1.5;
      g.strokeStyle = `hsla(${22+rand()*20},100%,${62+(1-t)*30}%,${(0.05+rand()*0.3)*(1-t*0.75)})`;
      g.lineWidth = 0.5 + rand()*2.2*(1-t*0.5);
      g.beginPath(); g.arc(0,0,rr,a0,a0+len); g.stroke();
    }
    // dark lanes between the bands
    g.globalCompositeOperation = 'destination-out';
    for(let i=0;i<lanes;i++){
      const rr = rIn + (rOut-rIn)*(0.08+rand()*0.92);
      const a0 = rand()*6.2832, len = 0.4 + rand()*2.2;
      g.strokeStyle = `rgba(0,0,0,${0.08+rand()*0.22})`;
      g.lineWidth = 0.8 + rand()*2.6;
      g.beginPath(); g.arc(0,0,rr,a0,a0+len); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    if(hotEdge){
      g.strokeStyle = 'rgba(255,248,230,0.85)'; g.lineWidth = 1.6;
      g.beginPath(); g.arc(0,0,rIn+0.8,0,6.2832); g.stroke();
    }
    return { c, R:rOut };
  }

  const disk = ringTexture(r*1.28, r*4.6, [
    [0,'rgba(255,252,240,0.95)'], [0.06,'rgba(255,232,185,0.9)'], [0.2,'rgba(255,176,95,0.72)'],
    [0.42,'rgba(236,116,48,0.4)'], [0.68,'rgba(176,62,24,0.15)'], [1,'rgba(120,30,10,0)']
  ], 240, 70, true);
  const halo = ringTexture(r*1.03, r*2.1, [
    [0,'rgba(255,250,236,0.95)'], [0.12,'rgba(255,222,165,0.8)'], [0.35,'rgba(255,160,80,0.45)'],
    [0.7,'rgba(200,80,30,0.12)'], [1,'rgba(150,40,12,0)']
  ], 120, 40, false);
  return (bhCache[key] = { disk, halo });
}

const BH_TILT = -0.12, BH_FLAT = 0.23;
function drawBHSparks(r, phase, front){
  // hot clumps orbiting in the disk: inner ones faster, like real orbits
  const dIn = r*1.3, dOut = r*4.2;
  for(let i=0;i<22;i++){
    const t = Math.pow(((i*0.618)%1), 1.3);
    const rr = dIn + (dOut-dIn)*t;
    const a = i*2.39 + phase*0.55*Math.pow(dIn/rr, 1.5);
    const sy = Math.sin(a);
    if((sy>0) !== front) continue;
    const x = Math.cos(a)*rr, y = sy*rr*BH_FLAT;
    const ca = Math.cos(BH_TILT), sa = Math.sin(BH_TILT);
    const px = x*ca - y*sa, py = x*sa + y*ca;
    const doppler = 0.55 + 0.45*(-Math.cos(a));            // the side coming toward us is brighter
    const s = r*(0.07 + (1-t)*0.07);
    drawGlow(px, py, s*3, 30 + (1-t)*14, (0.35 + 0.4*(1-t))*doppler);
  }
}

function drawGateBlackHole2D(x, y, r, phase, prog, flash){
  const T = bhTextures(r);
  flash = flash || 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalCompositeOperation = 'lighter';

  // warm bloom around the whole thing
  const bloom = ctx.createRadialGradient(0, 0, r*0.9, 0, 0, r*3.4);
  bloom.addColorStop(0, `rgba(255,170,80,${0.22+flash*0.3})`);
  bloom.addColorStop(0.4, `rgba(220,100,40,${0.09+flash*0.12})`);
  bloom.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bloom;
  ctx.beginPath(); ctx.arc(0, 0, r*3.4, 0, Math.PI*2); ctx.fill();

  const spin = phase*0.32;
  const paintDisk = (alpha)=>{
    ctx.save();
    ctx.rotate(BH_TILT); ctx.scale(1, BH_FLAT); ctx.rotate(spin);
    ctx.globalAlpha = alpha;
    ctx.drawImage(T.disk.c, -T.disk.R, -T.disk.R, T.disk.R*2, T.disk.R*2);
    ctx.restore();
  };

  // 1. the whole disk (its far half ends up behind the shadow)
  paintDisk(0.95);
  drawBHSparks(r, phase, false);

  // 2. the far side of the disk, bent by gravity into a ring over and under the shadow
  ctx.save();
  ctx.rotate(BH_TILT); ctx.scale(1, 0.94); ctx.rotate(-phase*0.45);
  ctx.globalAlpha = 0.62 + flash*0.3;
  ctx.drawImage(T.halo.c, -T.halo.R, -T.halo.R, T.halo.R*2, T.halo.R*2);
  ctx.restore();
  ctx.save();                                               // the upper arc is the thickest and brightest
  ctx.rotate(BH_TILT);
  ctx.beginPath(); ctx.rect(-r*2.2, -r*2.2, r*4.4, r*2.2); ctx.clip();
  ctx.scale(1.06, 1.04); ctx.rotate(-phase*0.45 + 1.3);
  ctx.globalAlpha = 0.75;
  ctx.drawImage(T.halo.c, -T.halo.R, -T.halo.R, T.halo.R*2, T.halo.R*2);
  ctx.restore();

  // 3. the shadow — hard black so the trail fade never shows through
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();

  // 4. photon ring: a thin white-hot edge
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = 'rgba(255,190,110,0.8)'; ctx.shadowBlur = 6;
  ctx.strokeStyle = `rgba(255,240,215,${0.75+flash*0.25})`; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, r*1.015, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  // 5. the near half of the disk crosses in front of the shadow
  ctx.save();
  ctx.rotate(BH_TILT);
  ctx.beginPath(); ctx.rect(-T.disk.R, 0, T.disk.R*2, T.disk.R); ctx.clip();
  ctx.rotate(-BH_TILT);
  paintDisk(1);
  ctx.restore();
  drawBHSparks(r, phase, true);

  // 6. Doppler glow: the side of the disk that turns toward us shines brighter
  ctx.save();
  ctx.rotate(BH_TILT); ctx.scale(1, 0.22);
  const dg = ctx.createRadialGradient(-r*1.9, 0, 0, -r*1.9, 0, r*2.2);
  dg.addColorStop(0, `rgba(255,236,205,${0.32+0.06*Math.sin(phase*1.3)+flash*0.3})`);
  dg.addColorStop(1, 'rgba(255,160,80,0)');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(-r*1.9, 0, r*2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // delivery progress: a faint warm arc well outside the disk glow
  if(prog>0.001){
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,214,150,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r*2.25, -Math.PI/2, -Math.PI/2 + Math.min(prog,1)*Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- cargo ships ----------------
   Ships drift in space. Your gravity pulls them just like the lights, only
   slower because they are heavy; the bigger the swarm, the stronger the pull.
   Drag them into the big black hole. Purple holes swallow ships too.

   Ship pictures: ships/ship01.png, ships/ship02.png ... up to ship20.png
   (next to this file). 3/4 view with the nose to the lower LEFT, transparent PNG.
   A 150 px wide picture is a normal ship; a wider picture makes a bigger,
   heavier ship. Missing pictures are fine: the game draws its own ship. */
const SHIP_MAX = 20;
const SHIP_SPRITES = [];
(function loadShipSprites(i){
  if(i > SHIP_MAX) return;
  const img = new Image();
  img.onload = () => { SHIP_SPRITES.push(img); loadShipSprites(i+1); };   // stops at the first missing number
  img.src = 'ships/ship' + String(i).padStart(2,'0') + '.png';
})(1);

const SHIP_STYLES = [
  { hull:['#c9d6e4','#5d6f86'], stripe:'#ff9a3c', glass:'#7ff3ff' },
  { hull:['#d8d0c4','#6e6355'], stripe:'#47d1ff', glass:'#b6ff9e' },
  { hull:['#c4c9d9','#4c5470'], stripe:'#ff5f7a', glass:'#ffe27a' }
];
function shipLean(s){ return Math.max(-0.25, Math.min(0.25, -s.vy*0.05*(s.face || 1))) + Math.sin(s.t*0.9)*0.03; }
function drawShipBody(s){
  const r = s.r;
  ctx.save();
  ctx.translate(s.x, s.y);
  const fl = 0.55 + 0.45*Math.sin(s.t*31) * Math.sin(s.t*17);
  const eng = s.state==='drift' ? 0.3 + s.tow*0.5 : 0.2;

  if(s.sprite){
    // the pictures are drawn at a 3/4 angle with the nose to the lower left:
    // they stay upright, flip to face their way and lean a little
    const face = s.faceA || 1;
    ctx.rotate(s.state==='fall' ? s.lean : shipLean(s));
    ctx.scale(s.scale*s.stretch*face, s.scale/Math.sqrt(s.stretch));
    const w = r*2.8, h = w*s.sprite.naturalHeight/s.sprite.naturalWidth;
    ctx.globalCompositeOperation = 'lighter';
    if(s.state!=='fall') drawGlow(w*0.38, -h*0.22, r*0.55*(0.8+fl*0.3), 195, eng);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.max(0, s.alpha == null ? 1 : s.alpha);
    ctx.drawImage(s.sprite, -w/2, -h/2, w, h);
  } else {
    ctx.rotate(s.ang);
    ctx.scale(s.scale*s.stretch, s.scale/Math.sqrt(s.stretch));
    // engine glow: brighter while you pull it
    ctx.globalCompositeOperation = 'lighter';
    if(s.state!=='fall') drawGlow(-r*1.12, 0, r*0.6*(0.8+fl*0.3), 195, eng);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = s.state==='fall' ? Math.max(0, s.alpha) : 1;
    const st = s.style;
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, st.hull[0]); g.addColorStop(1, st.hull[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo( r*1.45, 0);
    ctx.lineTo( r*0.55, -r*0.42); ctx.lineTo(-r*0.15, -r*0.48); ctx.lineTo(-r*0.55, -r*1.0);
    ctx.lineTo(-r*0.95, -r*0.95); ctx.lineTo(-r*0.8,  -r*0.42); ctx.lineTo(-r*1.05, -r*0.4);
    ctx.lineTo(-r*1.05,  r*0.4);  ctx.lineTo(-r*0.8,   r*0.42); ctx.lineTo(-r*0.95,  r*0.95);
    ctx.lineTo(-r*0.55,  r*1.0);  ctx.lineTo(-r*0.15,  r*0.48); ctx.lineTo( r*0.55,  r*0.42);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(20,28,40,0.55)';
    ctx.fillRect(-r*0.7, -r*0.32, r*0.95, r*0.64);
    ctx.fillStyle = st.stripe;
    ctx.fillRect(-r*0.6, -r*0.07, r*0.75, r*0.14);
    ctx.fillStyle = st.glass;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.ellipse(r*0.62, 0, r*0.32, r*0.17, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    if(Math.sin(s.blink*4) > 0.4){
      drawGlow(-r*0.75, -r*0.98, r*0.35, 355, 0.95);
      drawGlow(-r*0.75,  r*0.98, r*0.35, 130, 0.95);
    }
  }
  ctx.restore();
}

/* ---------------- rescue mode ----------------
   One of our ships is under attack. Enemy fighters circle it and shoot.
   Grab an enemy with your gravity (hold the button / touch), swing it and let go:
   into the black hole it goes, or into another enemy and both explode.
   Clear every enemy and the ship jumps away saved; if its hull breaks it explodes,
   its crew drifts out into space, and you lose one of three lives. */
const ENEMY_PICS = [1, 5, 7, 9, 12, 13, 15];                         // ship file numbers used for enemies
const FRIEND_PICS = [2, 3, 4, 6, 8, 10, 11, 14, 16, 17, 18, 19, 20];

// crew portraits: crew/<id>_calm.png, crew/<id>_scared.png, crew/<id>_panic.png (square PNG, ~256 px).
// Missing pictures are fine: the monitor draws a silhouette instead.
const CREW_PICS = {};
function crewPic(id, mood){
  const key = id + '_' + mood;
  if(!(key in CREW_PICS)){
    const img = new Image(); CREW_PICS[key] = null;

function spriteNo(n){ return SHIP_SPRITES[n-1] || null; }

let lives = 3, savedTotal = 0, lostTotal = 0;
let friend = null, enemies = [], bullets = [], bodies = [], debris = [], spawnQueue = [];

function shipBase(){ return Math.max(19, Math.min(32, Math.min(W,H)*0.041)); }

function rescueSetup(){
  enemies = []; bullets = []; spawnQueue = []; grabbed = null;
  killCombo = 1; killComboT = 0;
  // our ship parks well away from the black hole
  let fx, fy, tries = 0;
  do{ fx = rnd(W*0.18, W*0.82); fy = rnd(H*0.3, H*0.8); tries++; }
  while(tries < 40 && Math.hypot(fx-gate.x, fy-gate.y) < Math.min(W,H)*0.36);
  const pic = FRIEND_PICS[(level*7 + lives*3) % FRIEND_PICS.length];
  const fromLeft = fx > W/2;
  const crew = CREW.slice().sort(()=>Math.random()-0.5).slice(0, 2);
  friend = { x: fromLeft ? -120 : W+120, y: fy + rnd(-60,60), tx: fx, ty: fy, vx:0, vy:0,
    r: shipBase()*1.55, sprite: spriteNo(pic), style: SHIP_STYLES[level % SHIP_STYLES.length],
    hp:100, maxHp:100, hitT:0, people: Math.round(rnd(40, 320)), name: SHIP_NAMES[(level + lostTotal) % SHIP_NAMES.length],

          if(Math.hypot(o.x - e.x, o.y - e.y) < (o.r + e.r)*0.75){
            const mx = (o.x + e.x)/2, my = (o.y + e.y)/2;
            explodeAt(mx, my, 1.3, 30);
            breakShip(o, 1.6, 7); breakShip(e, 1.6, 7);
            enemyGone(o, 'smash'); enemyGone(e, 'smash');
            break;
          }
        }
        if(enemies.indexOf(e) < 0) continue;
        // a careless throw hurts our own ship
        if(f && f.state === 'drift' && Math.hypot(f.x - e.x, f.y - e.y) < (f.r + e.r)*0.7){
          hitFriend(6, (f.x + e.x)/2, (f.y + e.y)/2);
          const nx = e.x - f.x, ny = e.y - f.y, nl = Math.hypot(nx, ny) || 1;
          e.vx = nx/nl*sp*0.5; e.vy = ny/nl*sp*0.5;
        }
      }
      // a slow drop is no throw: once it slows down the pilot takes control again
      if(e.flungT <= 0 || (sp < 1.6 && e.flungT < 1.95)){ e.state = 'approach'; e.dazed = 0.6; }
    } else {
      // approach / attack: circle our ship and shoot at it
      e.tow = 0;
      if(e.dazed > 0) e.dazed -= dt;
      if(f && f.state === 'drift'){
        e.orbA += e.orbV*dt*GOD.enemySpeed;
        const tx = f.x + Math.cos(e.orbA)*e.orbR, ty = f.y + Math.sin(e.orbA)*e.orbR*0.75;
        const k = (e.type === 'bomber' ? 0.012 : 0.02)*GOD.enemySpeed;
        e.vx += (tx - e.x)*k; e.vy += (ty - e.y)*k;
        // pilots steer clear of the black hole: only your throw sends them in
        const ax = e.x - gate.x, ay = e.y - gate.y, ad = Math.hypot(ax, ay) || 1, avoid = gate.r*3.4;
        if(ad < avoid){ const p = (1 - ad/avoid)*0.9; e.vx += ax/ad*p; e.vy += ay/ad*p; }
        for(const v of voids){ const bx = e.x - v.x, by = e.y - v.y, bd = Math.hypot(bx, by) || 1; if(bd < v.r*4){ const p = (1 - bd/(v.r*4))*0.6; e.vx += bx/bd*p; e.vy += by/bd*p; } }
        e.vx *= 0.92; e.vy *= 0.92;
        const maxSp = (e.type === 'bomber' ? 2.2 : 3.6)*GOD.enemySpeed, sp = Math.hypot(e.vx, e.vy);
        if(sp > maxSp){ e.vx *= maxSp/sp; e.vy *= maxSp/sp; }
        const dF = Math.hypot(f.x - e.x, f.y - e.y);
        e.face = f.x > e.x ? -1 : 1;
        if(e.dazed <= 0 && dF < e.orbR*1.6){
          e.cd -= dt;
          if(e.cd <= 0){
            const big = e.type === 'bomber';
            e.cd = (big ? rnd(2.6, 3.4) : rnd(1.3, 1.9))*(1 - Math.min(0.3, level*0.02));
            const a = Math.atan2(f.y - e.y, f.x - e.x) + rnd(-0.05, 0.05), spd = big ? 4.2 : 7.5;
            bullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, life:3, big, dmg:(big ? 8 : 2.5)*f.dmgScale });
            drawGlowLater.push([e.x, e.y, e.r*0.9, big ? 25 : 355, 0.9]);
            tone(big ? 160 : 620, 0.07, big ? 'triangle' : 'square', 0.025, big ? 90 : 300);
          }
        }
      } else {
        // nothing left to shoot: they leave the way they came
        const ox = e.x - W/2, oy = e.y - H/2, ol = Math.hypot(ox, oy) || 1;
        e.vx += ox/ol*0.12; e.vy += oy/ol*0.12; e.vx *= 0.99; e.vy *= 0.99;
        e.face = e.vx > 0 ? -1 : 1;
        if(e.x < -140 || e.x > W + 140 || e.y < -140 || e.y > H + 140){ enemies.splice(i, 1); continue; }
      }
      e.x += e.vx; e.y += e.vy;
    }
    if(Math.abs(e.vx) > 0.35 && e.state !== 'approach') e.face = e.vx > 0 ? -1 : 1;
    e.faceA += ((e.face || 1) - (e.faceA || 1))*Math.min(dt*6, 1);

    // swallowed by the black hole or a purple hole
    if(e.state !== 'fall' && e.state !== 'held'){
      const gd = Math.hypot(gate.x - e.x, gate.y - e.y);
      if(gd < gate.r*0.95 + e.r*0.2){
        startEnemyFall(e, gate.x, gate.y); gate.flash = Math.max(gate.flash, 0.6);
        tone(70, 0.9, 'sine', 0.12, 140);
        enemyGone(e, 'hole'); enemies.push(e);       // keep drawing its fall
        continue;
      }
      for(const v of voids){
        if(Math.hypot(v.x - e.x, v.y - e.y) < v.r + e.r*0.2){ startEnemyFall(e, v.x, v.y); enemyGone(e, 'void'); enemies.push(e); break; }
      }
    }
  }

  // enemy fire
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life -= dt;
    if(f && f.state === 'drift' && Math.hypot(f.x - b.x, f.y - b.y) < f.r*0.8){ hitFriend(b.dmg, b.x, b.y); bullets.splice(i,1); continue; }
    if(b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) bullets.splice(i,1);
  }
  updateAftermath(dt);

  // win, lose, next
  const fighting = enemies.some(e => e.state !== 'fall') || spawnQueue.length > 0;
  if(rPhase === 'fight' && !fighting && f && f.state === 'drift') friendSaved();
  if(rPhase === 'jump' && rPhaseT > 2.6){ level++; resetLevel(); toast(T().level + ' ' + level); }
  if(rPhase === 'dead' && f && !f.lostShown && rPhaseT > 1.6){ f.lostShown = true; showBanner(T().rescue.signalLost + `<span class="sub">${T().rescue.lostSub(f.people)}</span>`, 'grad-pink'); }
  if(rPhase === 'dead' && rPhaseT > GOD.deathWait){
    if(lives > 0){ resetLevel(); toast(T().rescue.nextShip, 2.6); }
    else { gameOver(); }
  }
}

function updateBodies(dt){
  for(let i=bodies.length-1;i>=0;i--){
    const b = bodies[i];
    b.x += b.vx; b.y += b.vy; b.rot += b.vr*dt; b.ph += dt; b.life += dt;
    if(b.life > 18) b.a = Math.max(0, b.a - dt*0.3);
    if(b.a <= 0 || b.x < -80 || b.x > W + 80 || b.y < -80 || b.y > H + 80) bodies.splice(i,1);
  }
}

let drawGlowLater = [];
function drawBody(b){
  const s = b.s;
  ctx.save();
  ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  ctx.globalAlpha = b.a;
  // alive at first: arms and legs flail; then slower and slower until still
  const alive = GOD.flail > 0 ? Math.max(0, 1 - b.life/GOD.flail) : 0;
  const amp = 0.18 + 0.85*alive*alive, rate = 1.2 + 9*alive, q = b.ph*rate + (b.seed || 0);
  ctx.strokeStyle = '#c9d1dc'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = s*0.4;
  const limb = (x0, y0, a, bend) => { const x1 = x0 + Math.cos(a)*s*0.6, y1 = y0 + Math.sin(a)*s*0.6;
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x1 + Math.cos(a + bend)*s*0.55, y1 + Math.sin(a + bend)*s*0.55); };
  ctx.beginPath();
  limb(-s*0.22, s*0.55, 1.85 + Math.sin(q*0.9 + 1.7)*amp*0.9, -0.3 - Math.sin(q*1.1)*amp*0.6);     // legs
  limb( s*0.22, s*0.55, 1.3 + Math.sin(q*0.8 + 4.1)*amp*0.9, 0.3 + Math.sin(q*1.2 + 2)*amp*0.6);
  limb(-s*0.45, -s*0.25, 2.6 + Math.sin(q + 0.5)*amp*1.4, 0.5 + Math.sin(q*1.3)*amp*0.9);        // arms
  limb( s*0.45, -s*0.25, 0.55 + Math.sin(q*1.1 + 3.3)*amp*1.4, -0.5 - Math.sin(q*1.4 + 1)*amp*0.9);
  ctx.stroke();
  ctx.fillStyle = '#9aa6b5'; ctx.fillRect(-s*0.5, -s*0.55, s*1.0, s*0.9);    // backpack
  ctx.fillStyle = '#e3e8ef';
  ctx.beginPath(); ctx.ellipse(0, s*0.05, s*0.5, s*0.65, 0, 0, 6.283); ctx.fill();   // suit
  ctx.beginPath(); ctx.arc(0, -s*0.85, s*0.5, 0, 6.283); ctx.fill();                 // helmet
  ctx.fillStyle = '#16222f';
  ctx.beginPath(); ctx.ellipse(s*0.08, -s*0.85, s*0.32, s*0.24, 0, 0, 6.283); ctx.fill();   // visor
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(s*0.2, -s*0.95, s*0.08, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawRescue(hue){
  const f = friend;
  ctx.globalCompositeOperation = 'lighter';
  // bullets
  for(const b of bullets){
    if(b.big){ drawGlow(b.x, b.y, 11, 25, 1); drawGlow(b.x, b.y, 4, 45, 1); }
    else {
      ctx.strokeStyle = 'rgba(255,90,110,0.95)'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx*2.2, b.y - b.vy*2.2); ctx.lineTo(b.x, b.y); ctx.stroke();
      drawGlow(b.x, b.y, 6, 355, 0.8);
    }
  }
  for(const g of drawGlowLater) drawGlow(g[0], g[1], g[2], g[3], g[4]);
  drawGlowLater = [];
  drawAftermath();
  // our ship, with a shield flash when hit and its hull bar
  if(f && f.state !== 'dead'){
    if(f.state === 'drift'){
      ctx.globalCompositeOperation = 'lighter';
      const sh = 0.08 + f.hitT*1.6;
      ctx.strokeStyle = `rgba(120,230,255,${Math.min(0.7, sh)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r*1.6, f.r*1.15, 0, 0, 6.283); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    drawShipBody(f);
    if(f.state === 'drift'){
      const w = f.r*2.4, x = f.x - w/2, y = f.y - f.r*1.55 - 10, k = f.hp/f.maxHp;
      ctx.fillStyle = 'rgba(4,10,22,0.75)'; ctx.fillRect(x - 1, y - 1, w + 2, 7);
      ctx.fillStyle = k > 0.6 ? '#3ddc84' : k > 0.3 ? '#ffb547' : '#ff5f6d';
      ctx.fillRect(x, y, w*k, 5);
    }
  }
  // enemies, marked red; the one you can grab gets a ring
  let near = null, nd = 1e9;
  if(!grabbed && rPhase === 'fight'){
    for(const e of enemies){
      if(e.state === 'fall') continue;
      const d = Math.hypot(e.x - attractor.tx, e.y - attractor.ty), reach = e.r*1.4 + (IS_TOUCH ? 60 : 38);
      if(d < reach && d < nd){ nd = d; near = e; }
    }
  }
  for(const e of enemies){
    if(e.state !== 'fall'){
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(e.x, e.y, e.r*1.5, 355, e.state === 'held' ? 0.35 : 0.18);
      ctx.globalCompositeOperation = 'source-over';
    }
    drawShipBody(e);
    if(e.state === 'held' && e.gripMax){
      const k = Math.max(0, e.gripT/e.gripMax);
      ctx.strokeStyle = k > 0.35 ? 'rgba(160,240,255,0.95)' : 'rgba(255,120,120,0.95)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*1.7, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke();
    }
    if(e === near || e.state === 'held'){
      ctx.strokeStyle = e.state === 'held' ? `hsla(${hue},100%,80%,0.9)` : 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*1.45, 0, 6.283); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // the grip: a bright line from you to the enemy you hold
  if(grabbed){
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `hsla(${hue},100%,75%,0.7)`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(attractor.x, attractor.y); ctx.lineTo(grabbed.x, grabbed.y); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  for(const b of bodies) drawBody(b);
  ctx.globalAlpha = 1;
}

/* ---------------- crew monitor ---------------- */
const monEl = document.getElementById('monitor'), monCv = document.getElementById('monCv');
const monName = document.getElementById('monName'), monMsg = document.getElementById('monMsg'), monBar = document.getElementById('monBar');
const monCtx = monCv.getContext('2d');
let monText = '', monShown = 0, monSpeaker = 0, monNextT = 0, monMood = 'calm', monLost = false, monGlitch = 0, monLastKind = '';
function moodOf(){ if(!friend) return 'calm'; const k = friend.hp/friend.maxHp; return k > 0.65 ? 'calm' : k > 0.32 ? 'scared' : 'panic'; }
function fillMsg(s){ return s.replace('{ship}', friend ? friend.name : '').replace('{n}', friend ? friend.people : ''); }
function monitorSay(kind){
  const R = T().rescue, pool = R[kind]; if(!pool || !friend) return;
  if(kind === 'kill' && (monShown < monText.length || monLastKind === 'thanks')) return;   // don't cut a sentence short
  monSpeaker = kind === 'calm' ? 0 : (monSpeaker + 1) % friend.crew.length;
  monText = fillMsg(pool[Math.floor(Math.random()*pool.length)]);
  monShown = 0; monNextT = 4.5 + Math.random()*2.5; monLastKind = kind;
  const c = friend.crew[monSpeaker];
  monName.textContent = R.roles[c.role] + ' · ' + c.name + ' · ' + friend.name;
}
function monitorStart(){ monLost = false; monGlitch = 0.6; monMood = 'calm'; monEl.classList.remove('off','hurt','crit','lost'); monitorSay('calm'); }
function monitorHit(){ monGlitch = Math.max(monGlitch, 0.35); }
function monitorLost(){ monLost = true; monEl.classList.add('lost'); monText = T().rescue.signalLost; monShown = 0; }
function updateMonitor(dt){
  if(state !== STATE.PLAY || !friend){ monEl.classList.add('off'); return; }
  monEl.classList.remove('off');
  monGlitch = Math.max(0, monGlitch - dt);
  if(!monLost && friend.state === 'drift'){
    const m = moodOf();
    if(m !== monMood){ monMood = m; monitorSay(m); }
    monNextT -= dt;
    if(monNextT <= 0 && monShown >= monText.length) monitorSay(monMood);
  }
  monShown = Math.min(monText.length, monShown + dt*42);
  monMsg.textContent = monText.slice(0, Math.floor(monShown));
  const k = friend.hp/friend.maxHp;
  monBar.style.width = (k*100) + '%';
  monEl.classList.toggle('hurt', k <= 0.65 && k > 0.32);
  monEl.classList.toggle('crit', k <= 0.32 && !monLost);
}
function drawMonitor(now){
  if(!friend || monEl.classList.contains('off')) return;
  const S = Math.round(monCv.clientWidth*(DPR || 1)) || 84;
  if(monCv.width !== S){ monCv.width = monCv.height = S; }
  const g = monCtx, t = now/1000;
  const dmg = 1 - friend.hp/friend.maxHp, panic = monMood === 'panic', scared = monMood === 'scared';
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#04101a'; g.fillRect(0, 0, S, S);
  if(!monLost){
    const c = friend.crew[monSpeaker], L = c.look;
    const shake = (panic ? 2.2 : scared ? 0.9 : 0.2)*S/84;
    g.save();
    g.translate(Math.sin(t*37)*shake, Math.cos(t*29)*shake);
    const pic = crewPic(c.id, monMood) || crewPic(c.id, 'calm');
    if(pic){ g.drawImage(pic, 0, 0, S, S); }
    else {
      // stand-in portrait until the real pictures arrive
      g.fillStyle = '#0c2232'; g.fillRect(0, 0, S, S);
      g.fillStyle = L.suit; g.beginPath(); g.ellipse(S*0.5, S*1.02, S*0.42, S*0.3, 0, 0, 6.283); g.fill();
      if(L.cap){ g.fillStyle = '#e8c35a'; g.fillRect(S*0.14, S*0.8, S*0.14, S*0.05); g.fillRect(S*0.72, S*0.8, S*0.14, S*0.05); }
      g.fillStyle = L.skin; g.fillRect(S*0.44, S*0.6, S*0.12, S*0.14);
      if(L.female){ g.fillStyle = L.hair; g.beginPath(); g.ellipse(S*0.5, S*0.5, S*0.22, S*0.28, 0, 0, 6.283); g.fill(); }
      g.fillStyle = L.skin; g.beginPath(); g.ellipse(S*0.5, S*0.44, S*0.16, S*0.2, 0, 0, 6.283); g.fill();
      g.fillStyle = L.hair; g.beginPath(); g.ellipse(S*0.5, S*0.3, S*0.17, S*0.09, 0, 0, 6.283); g.fill();
      if(L.beard){ g.fillStyle = L.hair; g.beginPath(); g.ellipse(S*0.5, S*0.56, S*0.12, S*0.08, 0, 0, 6.283); g.fill(); }
      if(L.cap){ g.fillStyle = '#1b2f52'; g.fillRect(S*0.32, S*0.2, S*0.36, S*0.08); }
      g.fillStyle = '#1a1a1a';
      const eo = panic ? S*0.025 : S*0.018;
      g.beginPath(); g.arc(S*0.44, S*0.43, eo, 0, 6.283); g.arc(S*0.56, S*0.43, eo, 0, 6.283); g.fill();
      g.strokeStyle = '#5a2a22'; g.lineWidth = S*0.02;
      g.beginPath();
      if(panic){ g.ellipse(S*0.5, S*0.53, S*0.035, S*0.03, 0, 0, 6.283); } else if(scared){ g.moveTo(S*0.45, S*0.53); g.lineTo(S*0.55, S*0.53); } else { g.arc(S*0.5, S*0.5, S*0.05, 0.3, 2.8); }
      g.stroke();
    }
    g.restore();
    // red alarm light
    if(panic && Math.sin(t*9) > 0){ g.fillStyle = 'rgba(255,40,50,0.18)'; g.fillRect(0, 0, S, S); }
  }
  // static: more of it as the ship gets hurt, all of it when the signal is lost
  const noise = monLost ? 1 : Math.min(1, dmg*0.55 + monGlitch);
  if(noise > 0.02){
    const n = Math.round(S*S*0.02*noise*(monLost ? 6 : 1));
    for(let i=0;i<n;i++){ const v = (Math.random()*255)|0; g.fillStyle = `rgba(${v},${v},${v},${monLost ? 0.9 : 0.5})`; g.fillRect(Math.random()*S, Math.random()*S, 2, 1); }
    if(Math.random() < noise*0.5){ const y = Math.random()*S; g.drawImage(monCv, 0, y, S, S*0.08, (Math.random()-0.5)*S*0.12, y, S, S*0.08); }
  }
  // scanlines
  g.fillStyle = 'rgba(0,0,0,0.22)';
  for(let y=0;y<S;y+=3) g.fillRect(0, y, S, 1);
  if(monLost){ g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, S*0.42, S, S*0.16); g.fillStyle = '#ff6d78'; g.font = `800 ${Math.round(S*0.11)}px Segoe UI, sans-serif`; g.textAlign = 'center'; g.fillText('NO SIGNAL', S/2, S*0.535); }
}

/* ---------------- audio ---------------- */
let AC=null, muted = localStorage.getItem('swarm_mute')==='1';
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur, type, vol, glide){
  if(muted) return; const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(glide) o.frequency.exponentialRampToValueAtTime(glide, ac.currentTime+dur);
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(vol||0.12, ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.02);
}

let level=1, delivered=0, need=10, timeLeft=30, score=0;

function swarmHue(){
  // cyan -> violet -> gold as swarm grows
  const n = swarm.length;
  const t = Math.min(n/90, 1);
  return 190 + t*130; // 190 .. 320 -> then wrap to gold
}
function swarmHueGold(){
  const n = swarm.length;
  if(n < 90) return 190 + (n/90)*130;
  return 45; // gold when huge
}
function curHue(){ return swarmHueGold(); }

function rnd(a,b){ return a + Math.random()*(b-a); }

function spawnMote(){
  // spawn away from gate & attractor a bit
  let x,y,tries=0;
  do{ x=rnd(30,W-30); y=rnd(30,H-30); tries++; }
  while(tries<8 && Math.hypot(x-gate.x,y-gate.y)<90);
  motes.push({
    x,y, vx:rnd(-0.25,0.25), vy:rnd(-0.25,0.25),
    ph: rnd(0,6.28), hue: rnd(175,205), r: rnd(2.6,4.2), seed: Math.random()*1000
  });
}

function resetLevel(){
  swarm=[]; motes=[]; voids=[]; repulsors=[]; absorb=[]; floaters=[];
  delivered=0;
  combo=1; comboTimer=0; comboWrapEl.classList.remove('show');
  gate.r = Math.max(34, Math.min(58, Math.min(W,H)*0.072));
  gate.flash = 0;
  gate.x = rnd(W*0.25, W*0.75); gate.y = rnd(H*0.32, H*0.7);
  attractor.x = attractor.tx = W/2; attractor.y = attractor.ty = H*0.85;
  attractor.vx = attractor.vy = 0;
  lastTx = attractor.tx; lastTy = attractor.ty; pvx = pvy = 0;

  // lights are for points
  for(let i=0;i<26;i++) spawnMote();
  // purple holes from level 4: they eat lights and swallow enemies too
  const voidCount = level >= 7 ? 2 : level >= 4 ? 1 : 0;
  for(let i=0;i<voidCount;i++){
    let vx,vy,tries=0;
    do{ vx=rnd(W*0.12,W*0.88); vy=rnd(H*0.2,H*0.85); tries++; }
    while(tries<20 && Math.hypot(vx-gate.x,vy-gate.y)<170);
    voids.push({ x: vx, y: vy, r: rnd(16,22), pull: rnd(60,80), vx: rnd(-0.25,0.25), vy: rnd(-0.25,0.25), spin: rnd(0,6.28) });
  }
  rescueSetup();
  updateHUD();
}

function startGame(){
  level=Math.max(1, Math.round(GOD.startLevel)); score=0; combo=1; comboTimer=0; deathFade=0;
  lives=3; savedTotal=0; lostTotal=0; bodies=[]; fx=[]; wrecks=[]; debris=[];
  clearing=false; clearT=0; newRecord=false; bursts=[]; rings=[];
  comboWrapEl.classList.remove('show'); recordEl.classList.remove('show');
  resetLevel();
  state=STATE.PLAY;
  menu.classList.add('hidden'); over.classList.add('hidden');
  hud.classList.add('on');
  pulseBtn.classList.toggle('on', IS_TOUCH);
  toast(T().level+' '+level);
  audio();
}

function nextLevel(){ level++; resetLevel(); }

function gameOver(){
  state=STATE.OVER;
  deathFade=0.0001; // begin quiet fade
  newRecord = score>best;
  if(newRecord){ best=score; localStorage.setItem('swarm_best', String(best)); }
  // soft tragic tone
  tone(220,1.1,'sine',0.12,110);
  setTimeout(()=>tone(150,1.4,'sine',0.09,70),180);
  setTimeout(()=>{
    hud.classList.remove('on'); pulseBtn.classList.remove('on');
    comboWrapEl.classList.remove('show');
    document.getElementById('finalStats').innerHTML = T().final(score, level, best, savedTotal, lostTotal);
    // pompous grade reveal
    const g = score>=12000?'S': score>=6000?'A': score>=2500?'B': score>=900?'C':'D';
    gradeEl.textContent=g;
    gradeEl.className = g==='S'?'grad-gold': g==='A'?'grad-cyan': g==='B'?'grad-pink':'grad-cyan';
    gradeEl.classList.remove('reveal'); void gradeEl.offsetWidth; gradeEl.classList.add('reveal');
    if(newRecord){
      recordEl.textContent='★ '+T().record+' ★';
      recordEl.classList.add('show');
      spawnBurst(W/2,H*0.42,60,45,6);
      spawnRing(W/2,H*0.42,45,260,4,0.8);
      fanfare(784);
    } else { recordEl.classList.remove('show'); }
    over.classList.remove('hidden');
  }, 1100);
}

  if(pulseCd>0 || state!==STATE.PLAY) return;
  pulseActive=0.45; pulseCd=3.2;
  // pulse also knocks nearby enemies back for a moment
  for(const en of enemies){ if(en.state==='fall'||en.state==='held') continue; const dx=en.x-attractor.x, dy=en.y-attractor.y, d=Math.hypot(dx,dy)||1; if(d<230){ en.vx+=dx/d*9/en.mass; en.vy+=dy/d*9/en.mass; en.dazed=1.2; } }

  pulseBtn.classList.add('cool');
}

/* Milky Way sky — computed pixel by pixel once per screen size, then laid under
   every frame. No canvas gradients here: the browser dithers those with a fixed
   pattern, and hundreds of them stacked showed up as a fine grid.
   A glowing galactic band from lower left to upper right with dark dust rifts,
   two distant nebulae, thousands of faint stars, a few bright ones, and the
   dark vignette at the edges. */
let skyCv = null, skyW = 0, skyH = 0;
function skyNoise(seed){
  const hash = (x, y) => { let h = (x*374761393 + y*668265263 + seed*2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);
    const a = hash(xi, yi), b = hash(xi+1, yi), c = hash(xi, yi+1), d = hash(xi+1, yi+1);
    return a + (b - a)*u + (c - a)*v + (a - b - c + d)*u*v; };
  return (x, y) => { let s = 0, amp = 0.5, f = 1; for(let o=0;o<5;o++){ s += amp*vn(x*f, y*f); f *= 2.03; amp *= 0.5; } return s; };
}
function buildSky(){
  const sd = Math.min(DPR || 1, 1.5);
  const cw = Math.ceil(W*sd), ch = Math.ceil(H*sd);
  // the soft light is computed at half size and smoothed up; stars are added at full size
  const hw = Math.ceil(cw/2), hh = Math.ceil(ch/2);
  const half = document.createElement('canvas'); half.width = hw; half.height = hh;
  const hg = half.getContext('2d');
  const img = hg.createImageData(hw, hh), px = img.data;
  const n1 = skyNoise(11), n2 = skyNoise(29), n3 = skyNoise(47);
  const m = Math.min(hw, hh), L = Math.hypot(hw, hh);
  const ang = -Math.atan2(hh, hw)*0.85, ca = Math.cos(ang), sa = Math.sin(ang);
  const cx = hw*0.5, cy = hh*0.56, bw = m*0.2, coreU = L*0.06;
  const neb = [[hw*0.14, hh*0.22, m*0.22, [70, 32, 105]], [hw*0.86, hh*0.8, m*0.22, [18, 70, 88]]];
  const sc = 4/m;                                                     // noise scale
  let i = 0;
  for(let y=0;y<hh;y++){
    for(let x=0;x<hw;x++, i+=4){
      const dx = x - cx, dy = y - cy;
      const u = dx*ca + dy*sa, v = -dx*sa + dy*ca;                     // along / across the band
      const t1 = n1(x*sc, y*sc), t2 = n2(x*sc*2.2, y*sc*2.2);
      const wob = (t1 - 0.5)*bw*0.5;
      const band = Math.exp(-Math.pow((v + wob)/(bw*1.05), 2));
      const core = Math.exp(-Math.pow((u - coreU)/(L*0.2), 2)) * Math.exp(-Math.pow(v/(bw*0.55), 2));
      const clouds = 0.45 + 0.75*t2;
      // dust rifts wander down the middle of the band
      const rift = Math.sin(u/L*9 + 1.3)*bw*0.22 + Math.sin(u/L*23)*bw*0.08;
      const dust = Math.exp(-Math.pow((v - rift)/(bw*0.26), 2)) * Math.max(0, n3(x*sc*1.6, y*sc*1.6)*1.9 - 0.55);
      const glow = band*clouds*(1 - Math.min(0.85, dust*0.9));
      const warm = Math.min(1, core*1.3);
      let r = 4 + glow*(30 + 60*warm) + core*70*(1 - dust*0.6);
      let g = 6 + glow*(34 + 40*warm) + core*52*(1 - dust*0.6);
      let b = 15 + glow*(58 + 10*warm) + core*36*(1 - dust*0.6);
      // a touch of violet in the clouds
      const vio = band*Math.max(0, t1 - 0.55)*1.4;
      r += vio*26; b += vio*30;
      for(const q of neb){
        const d = Math.hypot(x - q[0], y - q[1])/q[2];
        const k = Math.exp(-d*d*1.6) * (0.5 + t2);
        r += q[3][0]*k*0.5; g += q[3][1]*k*0.5; b += q[3][2]*k*0.5;
      }
      // dark vignette at the screen edges
      const ex = (x/hw - 0.5)*2, ey = (y/hh - 0.5)*2, e = Math.max(0, Math.hypot(ex*0.8, ey) - 0.62);
      const vg = 1 - Math.min(0.5, e*0.75);
      const dn = Math.random() - 0.5;                                  // random dither, no pattern
      px[i]   = r*vg + dn; px[i+1] = g*vg + dn; px[i+2] = b*vg + dn; px[i+3] = 255;
    }
  }
  hg.putImageData(img, 0, 0);

  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(half, 0, 0, cw, ch);

  // stars: denser inside the band
  let seed = 20261027;
  const R = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const Lf = Math.hypot(cw, ch), bwf = Math.min(cw, ch)*0.2;
  const angF = -Math.atan2(ch, cw)*0.85, cf = Math.cos(angF), sf = Math.sin(angF);
  const gauss = () => (R() + R() + R() + R() - 2)*0.87;
  g.globalCompositeOperation = 'lighter';
  const dot = (x, y, s, rgb, a) => { g.fillStyle = `rgba(${rgb},${a})`; g.fillRect(x, y, s, s); };
  for(let k=0;k<3200;k++){
    const u = (R() - 0.5)*Lf*1.1, v = gauss()*bwf*0.9;
    dot(cw*0.5 + u*cf - v*sf, ch*0.56 + u*sf + v*cf, 0.4 + R()*0.8, R()<0.6 ? '220,230,255' : '255,236,205', 0.15 + R()*0.5);
  }
  for(let k=0;k<Math.round(cw*ch/1300);k++) dot(R()*cw, R()*ch, 0.4 + R()*0.9, R()<0.7 ? '210,225,255' : '255,230,200', 0.12 + R()*0.55);
  // a few bright stars: layered dots for the halo, small spikes on some
  for(let k=0;k<34;k++){
    const x = R()*cw, y = R()*ch, s = (0.8 + R()*1.3)*sd, rgb = R() < 0.35 ? '255,214,170' : '190,215,255';
    for(let q=4;q>=1;q--){ g.fillStyle = `rgba(${rgb},${0.05})`; g.beginPath(); g.arc(x, y, s*q*1.6, 0, 6.283); g.fill(); }
    g.fillStyle = `rgba(${rgb},0.95)`; g.beginPath(); g.arc(x, y, s*0.7, 0, 6.283); g.fill();
    if(k % 5 === 0){
      g.strokeStyle = `rgba(${rgb},0.3)`; g.lineWidth = 0.7*sd;
      g.beginPath(); g.moveTo(x - s*9, y); g.lineTo(x + s*9, y); g.moveTo(x, y - s*9); g.lineTo(x, y + s*9); g.stroke();
    }
  }
  g.globalCompositeOperation = 'source-over';
  skyCv = c; skyW = W; skyH = H;
}

/* soft round glow made from real pixels (no dithered gradient), reused for the black hole bloom */
const softGlowCv = (function(){
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), p = img.data;
  for(let y=0, i=0;y<S;y++) for(let x=0;x<S;x++, i+=4){
    const d = Math.hypot(x - S/2 + 0.5, y - S/2 + 0.5)/(S/2);
    const a = d >= 1 ? 0 : Math.pow(1 - d, 2.2);
    p[i] = 255; p[i+1] = 150; p[i+2] = 70; p[i+3] = Math.round(a*255);
  }
  g.putImageData(img, 0, 0);
  return c;
})();

function drawAtmosphere(now){
  const t=now*0.00005;
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  // (the Milky Way picture underneath is drawn by render)

  // distant dust, dimmer than the playable motes
  ctx.globalCompositeOperation='lighter';
  for(const p of dust){
    p.x+=p.vx*0.016; p.y+=p.vy*0.016;
    if(p.x<0)p.x+=1; if(p.x>1)p.x-=1;
    if(p.y<0)p.y+=1; if(p.y>1)p.y-=1;
    const tw=0.65+0.35*Math.sin(now*0.0004+p.x*12);
    ctx.globalAlpha=p.a*tw*0.55;
    ctx.fillStyle=p.warm?'#e7b48a':'#9eb6d4';
    ctx.beginPath();
    ctx.arc(p.x*W, p.y*H, p.r, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();
}

/* film grain: a few noise tiles, drawn one screen pixel per grain (never stretched,
   which is what made the old grain show as a grid on scaled screens), swapped and
   shifted about 24 times a second so no tile edge or repeat can be seen */
const GRAIN_TILE = 256, grainTiles = [];
for(let k=0;k<4;k++){
  const c = document.createElement('canvas'); c.width = c.height = GRAIN_TILE;
  const g = c.getContext('2d'), img = g.createImageData(GRAIN_TILE, GRAIN_TILE), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = 128 + (Math.random() + Math.random() + Math.random() - 1.5)*120;
    d[i] = d[i+1] = d[i+2] = n; d[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  grainTiles.push(c);
}
let grainK = 0, grainOx = 0, grainOy = 0, grainTick = -1;
function drawFilmGrade(now){
  // (the edge vignette is part of the sky picture)
  const tick = (now/42)|0;
  if(tick !== grainTick){ grainTick = tick; grainK = (Math.random()*grainTiles.length)|0; grainOx = (Math.random()*GRAIN_TILE)|0; grainOy = (Math.random()*GRAIN_TILE)|0; }
  const gs = Math.max(1, Math.round(DPR || 1)), step = GRAIN_TILE*gs;    // whole screen pixels only
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = 0.16;
  const tile = grainTiles[grainK], cw = canvas.width, ch = canvas.height;
  for(let y = -grainOy*gs; y < ch; y += step)
    for(let x = -grainOx*gs; x < cw; x += step)
      ctx.drawImage(tile, x, y, step, step);
  ctx.restore();
}

/* ---------------- physics update ---------------- */
function update(dt){
  // attractor spring (weighty, delayed)
  const stiff=0.018, damp=0.86;
  attractor.vx += (attractor.tx-attractor.x)*stiff;
  attractor.vy += (attractor.ty-attractor.y)*stiff;
  attractor.vx*=damp; attractor.vy*=damp;
  attractor.x += attractor.vx; attractor.y += attractor.vy;

  if(pulseActive>0) pulseActive-=dt;
  if(pulseCd>0){ pulseCd-=dt; if(pulseCd<=0) pulseBtn.classList.remove('cool'); }
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=1; }

  const grabR = pulseActive>0 ? 230 : 120;

  // free motes
  for(let i=motes.length-1;i>=0;i--){
    const m=motes[i];
    m.ph+=dt*2;
    // gentle wander
    m.vx += Math.cos(m.ph*0.6+m.seed)*0.004;
    m.vy += Math.sin(m.ph*0.5+m.seed)*0.004;
    // attraction
    const dx=attractor.x-m.x, dy=attractor.y-m.y; const d=Math.hypot(dx,dy)||1;
    if(d<grabR){
      const f=(1-d/grabR)*0.55;
      m.vx += dx/d*f; m.vy += dy/d*f;
    }
    m.vx*=0.94; m.vy*=0.94;
    m.x+=m.vx; m.y+=m.vy;
    // wrap softly
    if(m.x<-20)m.x=W+20; if(m.x>W+20)m.x=-20; if(m.y<-20)m.y=H+20; if(m.y>H+20)m.y=-20;
    // attach
    if(d<26 && swarm.length<MAX_SWARM){
      swarm.push({x:m.x,y:m.y,vx:m.vx,vy:m.vy,ph:rnd(0,6.28),r:rnd(2.4,3.8),ang:rnd(0,6.28),orb:rnd(16,60)});
      motes.splice(i,1);
      score+=1; updateHUD();
      spawnBurst(m.x,m.y,4,m.hue,2.2);
      spawnRing(m.x,m.y,m.hue,26,1.5,0.35);
      tone(rnd(520,760),0.07,'sine',0.05);
      if(motes.length < need+8) spawnMote();
    }
  }

  // swarm particles: swirl around attractor (iterate backwards: splice-safe)
  const hue=curHue();
  const blobR = 14 + Math.sqrt(swarm.length)*3.4;
  for(let i=swarm.length-1;i>=0;i--){
    const p=swarm[i];
    const dx=attractor.x-p.x, dy=attractor.y-p.y; const d=Math.hypot(dx,dy)||1;
    // spring toward blob shell
    let f=0;
    if(d>blobR) f=0.08; else f=-0.05*(1-d/blobR);
    p.vx += dx/d*f; p.vy += dy/d*f;
    // tangential swirl
    p.vx += -dy/d*0.035; p.vy += dx/d*0.035;
    // follow attractor momentum slightly
    p.vx += attractor.vx*0.004; p.vy += attractor.vy*0.004;
    p.vx*=0.90; p.vy*=0.90;
    p.x+=p.vx; p.y+=p.vy;

    // voids eat
    let eaten=false;
    for(const v of voids){
      const vdx=v.x-p.x, vdy=v.y-p.y; const vd=Math.hypot(vdx,vdy)||1;
      if(vd<v.pull){
        const vf=(1-vd/v.pull)*0.5;
        p.vx -= vdx/vd*vf*-1*0; // placeholder
        // pull toward void
        p.vx += vdx/vd*vf; p.vy += vdy/vd*vf;
      }
      if(vd<v.r*0.7){ eaten=true; }
    }
    // repulsors push
    for(const rp of repulsors){
      const rdx=p.x-rp.x, rdy=p.y-rp.y; const rd=Math.hypot(rdx,rdy)||1;
      if(rd<rp.r*2.4){ const rf=(1-rd/(rp.r*2.4))*0.6; p.vx+=rdx/rd*rf; p.vy+=rdy/rd*rf; }
    }
    if(eaten){
      swarm.splice(i,1);
      // tiny dark puff
      floaters.push({x:p.x,y:p.y,t:0.5,txt:'',dark:true});
      tone(rnd(120,180),0.12,'sawtooth',0.05,80);
      continue;
    }

    // gate delivery
    const gdx=gate.x-p.x, gdy=gate.y-p.y; const gd=Math.hypot(gdx,gdy)||1;
    if(gd<gate.r){
      swarm.splice(i,1);
      absorb.push({x:p.x,y:p.y,hue});
    }
  }

  updateRescue(dt);
  updateMonitor(dt);

  // absorb animation -> deliver
  for(let i=absorb.length-1;i>=0;i--){
    const a=absorb[i];
    const dx=gate.x-a.x, dy=gate.y-a.y; const d=Math.hypot(dx,dy)||1;
    a.x+=dx/d*7; a.y+=dy/d*7; a.t=(a.t||0)+dt;
    if(d<8 || a.t>0.6){
      absorb.splice(i,1);
      delivered++;
      comboTimer=1.6; combo=Math.min(combo+1, 20);
      const gain=10*combo; score+=gain;
      floaters.push({x:gate.x+rnd(-20,20),y:gate.y-20,t:1.0,txt:'+'+gain});
      spawnBurst(gate.x,gate.y,10,140,4.2);
      spawnRing(gate.x,gate.y,140,70,2.5,0.45);
      if(combo>=3){
        comboEl.textContent='x'+combo;
        comboWrapEl.classList.add('show');
        comboEl.classList.add('bump'); setTimeout(()=>comboEl.classList.remove('bump'),120);
      }
      tone(440+combo*45,0.1,'sine',0.09);
      updateHUD();
    }
  }

  // voids drift & bounce
  for(const v of voids){
    v.spin+=dt*1.5;
    v.x+=v.vx; v.y+=v.vy;
    if(v.x<40||v.x>W-40) v.vx*=-1;
    if(v.y<40||v.y>H-40) v.vy*=-1;
    v.x=Math.max(30,Math.min(W-30,v.x)); v.y=Math.max(30,Math.min(H-30,v.y));
  }
  for(const rp of repulsors) rp.ph+=dt*2;

  // floaters
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.t-=dt; f.y-=dt*22;
    if(f.t<=0) floaters.splice(i,1);
  }

  gate.phase+=dt*2;
  gate.flash=Math.max(0, gate.flash-dt*1.4);
  updateHUD();
}

/* ---------------- render ---------------- */
function render(){
  // Fade the previous frame. Alpha must stay above 0.5: a gentler fade
  // rounds back to the same pixel and leaves a permanent smear where
  // the swarm moved, which only a full canvas reset used to clear.
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
  if(!skyCv || skyW!==W || skyH!==H) buildSky();
  ctx.globalAlpha=0.58;
  ctx.drawImage(skyCv,0,0,W,H);
  ctx.globalAlpha=1;

  drawAtmosphere(performance.now());

  ctx.globalCompositeOperation='lighter';

  // background stars
  for(const s of stars){
    const a=0.25+0.25*Math.sin(s.p+performance.now()*0.001);
    ctx.globalAlpha=a*0.5; ctx.fillStyle='#8fb6ff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  const hue = state===STATE.PLAY ? curHue() : 195;

  // delivery target — glowing black hole (capture radius is still gate.r)
  if(state===STATE.PLAY || state===STATE.OVER){
    drawGateBlackHole(gate.x, gate.y, gate.r*0.92, gate.phase, 0, gate.flash);
  } else if(state===STATE.MENU){
    drawGateBlackHole(W*0.5, H*0.5, Math.min(W,H)*0.12, gate.phase, 0, 0);
  }

  // repulsors
  for(const rp of repulsors){
    const pulse=1+Math.sin(rp.ph)*0.12;
    drawGlow(rp.x,rp.y,rp.r*1.9*pulse,355,0.4);
    ctx.strokeStyle='rgba(255,110,130,0.7)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r*pulse,0,6.28); ctx.stroke();
  }

  // voids (black holes) — draw dark core with accretion glow
  for(const v of voids){
    drawGlow(v.x,v.y,v.r*3.4,275,0.45);
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#03040c';
    ctx.beginPath(); ctx.arc(v.x,v.y,v.r,0,6.28); ctx.fill();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(190,140,255,0.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(v.x,v.y,v.r,v.spin,v.spin+4.2); ctx.stroke();
  }

  // free motes
  for(const m of motes){
    drawGlow(m.x,m.y,m.r*4.5,m.hue,0.9);
  }

  // our ship, the enemies, their fire, and the crew if the ship is lost
  if(state===STATE.PLAY || state===STATE.OVER){
    drawRescue(hue);
    ctx.globalCompositeOperation='lighter';
  }

  // swarm
  for(const p of swarm){
    drawGlow(p.x,p.y,p.r*5,hue,1);
  }
  // attractor core
  if(state===STATE.PLAY){
    const coreR = pulseActive>0 ? 30 : 20;
    drawGlow(attractor.x,attractor.y,coreR*2.4,hue,1);
    ctx.strokeStyle=`hsla(${hue},100%,85%,0.9)`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(attractor.x,attractor.y,10,0,6.28); ctx.stroke();
    if(pulseActive>0){
      ctx.strokeStyle=`hsla(${hue},100%,80%,${pulseActive*1.6})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(attractor.x,attractor.y,210*(1-pulseActive/0.45)+20,0,6.28); ctx.stroke();
    }
  }

  // absorbing particles
  for(const a of absorb){ drawGlow(a.x,a.y,12,140,0.9); }

  // reward sparks & ring waves
  for(const b of bursts){ drawGlow(b.x,b.y,b.size*4,b.hue,Math.max(b.life,0)); }
  for(const r of rings){
    const a=Math.max(r.t/r.life,0);
    ctx.strokeStyle=`hsla(${r.hue},100%,75%,${a*0.8})`; ctx.lineWidth=r.width*a+0.5;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.283); ctx.stroke();
  }

  // floaters
  ctx.globalCompositeOperation='source-over';
  for(const f of floaters){
    if(f.dark) continue;
    ctx.globalAlpha=Math.max(f.t,0);
    ctx.fillStyle='#fff3c4'; ctx.font=f.big?'800 24px Segoe UI, sans-serif':'700 18px Segoe UI, sans-serif'; ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;

  // quiet death staging: swarm fades away slowly, gentle
  if(state===STATE.OVER && deathFade>0){
    deathFade=Math.min(deathFade+0.012,1);
    ctx.globalCompositeOperation='lighter';
    for(const p of swarm){
      p.x+=p.vx*0.4; p.y+=p.vy*0.4 - 0.2;
      drawGlow(p.x,p.y,p.r*5*(1-deathFade*0.6),hue,(1-deathFade)*0.9);
    }
    if(deathFade>=1) swarm=[];
  }
  ctx.globalCompositeOperation='source-over';

  drawFilmGrade(performance.now());
  if(state===STATE.PLAY) drawMonitor(performance.now()); else monEl.classList.add('off');

  // combo fade + urgency bar
  if(comboTimer<=0){ comboWrapEl.classList.remove('show'); }
  else { comboBarFill.style.transform='scaleX('+(comboTimer/1.6)+')'; }
  if(toastT>0){ toastT-=1/60; if(toastT<=0) toastEl.classList.remove('show'); }
}

/* ---------------- loop ---------------- */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  // reward sparks & ring waves advance in every state
  for(let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.x+=b.vx; b.y+=b.vy; b.vx*=0.92; b.vy*=0.92; b.life-=dt; if(b.life<=0) bursts.splice(i,1); }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.r+=r.vr*dt; r.t-=dt; if(r.t<=0) rings.splice(i,1); }
  if(state===STATE.PLAY){
    if(clearing){ clearT-=dt; update(dt*0.35); if(clearT<=0){ clearing=false; nextLevel(); } }
    else update(dt);
  } else if(state===STATE.MENU){
    // idle ambient motion of attractor
    attractor.tx=W/2+Math.cos(now*0.0004)*W*0.25;
    attractor.ty=H/2+Math.sin(now*0.0006)*H*0.2;
    attractor.vx += (attractor.tx-attractor.x)*0.01; attractor.vy += (attractor.ty-attractor.y)*0.01;
    attractor.vx*=0.9; attractor.vy*=0.9; attractor.x+=attractor.vx; attractor.y+=attractor.vy;
    for(const m of motes){
      m.ph+=dt*2; m.x+=Math.cos(m.ph*0.6+m.seed)*0.3; m.y+=Math.sin(m.ph*0.5+m.seed)*0.3;
      const dx=attractor.x-m.x,dy=attractor.y-m.y,d=Math.hypot(dx,dy)||1;
      if(d<120){ m.vx+=dx/d*0.05; m.vy+=dy/d*0.05; }
      m.vx*=0.95;m.vy*=0.95;m.x+=m.vx;m.y+=m.vy;
      if(m.x<-20)m.x=W+20;if(m.x>W+20)m.x=-20;if(m.y<-20)m.y=H+20;if(m.y>H+20)m.y=-20;
    }
    gate.phase+=dt*2;
  } else if(state===STATE.OVER){
    // voids keep drifting quietly
    for(const v of voids){ v.spin+=dt; v.x+=v.vx*0.4; v.y+=v.vy*0.4;
      if(v.x<40||v.x>W-40)v.vx*=-1; if(v.y<40||v.y>H-40)v.vy*=-1; }
    for(const m of motes){ m.ph+=dt*2; m.x+=Math.cos(m.ph*0.6+m.seed)*0.3; m.y+=Math.sin(m.ph*0.5+m.seed)*0.3; }
    updateAftermath(dt);
  }
  render();
  requestAnimationFrame(loop);
}
applyLang();
window.__dbg = { startGame, tryGrab, releaseGrab, get enemies(){return enemies;}, get friend(){return friend;}, get rPhase(){return rPhase;}, get lives(){return lives;}, get savedTotal(){return savedTotal;}, get bodies(){return bodies;}, get attractor(){return attractor;}, get gate(){return gate;}, get swarm(){return swarm;}, get motes(){return motes;}, get state(){return state;}, get level(){return level;}, get score(){return score;}, setTarget, gameOver };
requestAnimationFrame(loop);

})();
</script>
